<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2次方程式・不等式の可視化</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in {
            animation: fadeIn 0.25s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center py-6 px-4">

    <header class="max-w-4xl w-full text-center mb-6">
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">2次方程式・不等式の可視化</h1>
        <p class="text-sm sm:text-base text-slate-600">
            関数のグラフ、x軸との交点、不等式の解釈、および解となる範囲を視覚的に確認できます。
        </p>
    </header>

    <main class="max-w-4xl w-full bg-white rounded-2xl shadow-xl p-6 sm:p-8 flex flex-col gap-6">

        <section class="flex flex-col gap-2">
            <label class="text-xs sm:text-sm font-semibold text-slate-700 uppercase tracking-wide">1. 2次式（パターン）の選択</label>
            <div id="preset-buttons" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <!-- Buttons injected via JS -->
            </div>
        </section>

        <section class="flex flex-col gap-2">
            <label class="text-xs sm:text-sm font-semibold text-slate-700 uppercase tracking-wide">2. 記号（方程式・不等式）の選択</label>
            <div id="relation-buttons" class="flex flex-wrap gap-2">
                <!-- Buttons injected via JS -->
            </div>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-stretch">
            <section class="bg-slate-100 rounded-xl p-4 flex flex-col justify-center items-center text-center md:col-span-4">
                <span class="text-xs text-slate-500 block mb-1">現在の式</span>
                <div id="current-expression" class="text-base sm:text-lg font-bold text-indigo-600 truncate w-full">
                    <!-- Formula dynamically updated -->
                </div>
            </section>

            <section id="solution-container" class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 flex flex-col justify-center fade-in md:col-span-8">
                <h2 class="text-xs sm:text-sm font-bold text-indigo-900 flex items-center gap-1.5 mb-1">
                    <svg class="w-4 h-4 text-indigo-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    解（答え）の記述
                </h2>
                <div id="solution-content" class="text-slate-700 text-sm leading-relaxed">
                    <!-- Solution dynamically updated -->
                </div>
            </section>
        </div>

        <section class="relative w-full bg-white border border-slate-200 rounded-xl p-2 sm:p-4 shadow-inner flex flex-col items-center">
            <div class="w-full h-[320px] sm:h-[420px] relative">
                <canvas id="graphCanvas"></canvas>
            </div>
            <p class="text-xs text-slate-400 mt-2 text-center">※ グラフの赤い線は y = f(x)、青いハイライトは条件を満たすxの範囲を示します。端点は赤のドット（塗りつぶし：含む、白抜き：含まない）で表示されます。</p>
        </section>

    </main>

    <script>
        const presets = [
            {
                id: 0,
                name: "パターン1: x² - 4x - 5",
                factorized: " (x + 1)(x - 5)",
                a: 1, b: -4, c: -5,
                roots: [-1, 5],
                discriminant: 36,
                vertex: { x: 2, y: -9 },
                desc: "x² - 4x - 5 = (x + 1)(x - 5)"
            },
            {
                id: 1,
                name: "パターン2: x² - 6x + 9",
                factorized: " (x - 3)²",
                a: 1, b: -6, c: 9,
                roots: [3],
                discriminant: 0,
                vertex: { x: 3, y: 0 },
                desc: "x² - 6x + 9 = (x - 3)²"
            },
            {
                id: 2,
                name: "パターン3: x² - 4x + 5",
                factorized: " (x - 2)² + 1",
                a: 1, b: -4, c: 5,
                roots: [],
                discriminant: -4,
                vertex: { x: 2, y: 1 },
                desc: "x² - 4x + 5 = (x - 2)² + 1"
            }
        ];

        const relations = [
            { symbol: "=", label: "= 0 (方程式)" },
            { symbol: ">", label: "> 0 (不等式)" },
            { symbol: ">=", label: "≧ 0 (不等式)" },
            { symbol: "<", label: "< 0 (不等式)" },
            { symbol: "<=", label: "≦ 0 (不等式)" }
        ];

        let currentPresetIndex = 0;
        let currentRelationIndex = 2; // Default to '>='
        let chartInstance = null;

        document.addEventListener("DOMContentLoaded", () => {
            renderControls();
            updateVisualization();
        });

        function renderControls() {
            const presetContainer = document.getElementById("preset-buttons");
            presetContainer.innerHTML = presets.map((p, idx) => `
                <button onclick="selectPreset(${idx})" class="p-3 rounded-xl border text-left transition-all font-medium text-sm flex flex-col gap-1 ${idx === currentPresetIndex ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'}">
                    <span class="font-bold">${p.name}</span>
                    <span class="text-xs opacity-80">${p.desc}</span>
                </button>
            `).join("");

            const relationContainer = document.getElementById("relation-buttons");
            relationContainer.innerHTML = relations.map((r, idx) => `
                <button onclick="selectRelation(${idx})" class="px-4 py-2.5 rounded-xl border text-sm font-semibold transition-all flex-1 min-w-[70px] ${idx === currentRelationIndex ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'}">
                    ${r.label}
                </button>
            `).join("");
        }

        function selectPreset(index) {
            currentPresetIndex = index;
            renderControls();
            updateVisualization();
        }

        function selectRelation(index) {
            currentRelationIndex = index;
            renderControls();
            updateVisualization();
        }

        function updateVisualization() {
            const p = presets[currentPresetIndex];
            const rel = relations[currentRelationIndex].symbol;

            const exprEl = document.getElementById("current-expression");
            const formulaStr = `${p.name.split(': ')[1]} ${rel} 0`;
            exprEl.innerText = formulaStr;
            exprEl.classList.remove('fade-in');
            void exprEl.offsetWidth;
            exprEl.classList.add('fade-in');

            const xMin = -2, xMax = 7;
            const step = 0.05;
            const xValues = [];
            const yValues = [];
            const highlightRangeX = [];
            const highlightRangeY = [];
            const axisHighlightX = [];
            const axisHighlightY = [];

            for (let x = xMin; x <= xMax + 0.001; x = Math.round((x + step) * 100) / 100) {
                xValues.push(x);
                const y = p.a * x * x + p.b * x + p.c;
                yValues.push(y);

                let satisfies = false;
                if (rel === "=") satisfies = Math.abs(y) < 0.05;
                else if (rel === ">") satisfies = y > 0;
                else if (rel === ">=") satisfies = y >= -0.01;
                else if (rel === "<") satisfies = y < 0;
                else if (rel === "<=") satisfies = y <= 0.01;

                if (satisfies) {
                    highlightRangeX.push(x);
                    highlightRangeY.push(y);
                } else {
                    highlightRangeX.push(null);
                    highlightRangeY.push(null);
                }

                let onAxisSatisfies = false;
                if (rel === "=") {
                    onAxisSatisfies = p.roots.some(r => Math.abs(x - r) <= 0.05);
                } else if (rel === ">") {
                    if (p.roots.length === 2) {
                        onAxisSatisfies = (x < p.roots[0] || x > p.roots[1]);
                    } else if (p.roots.length === 1) {
                        onAxisSatisfies = (Math.abs(x - p.roots[0]) > 0.05);
                    } else {
                        onAxisSatisfies = true;
                    }
                } else if (rel === ">=") {
                    if (p.roots.length === 2) {
                        onAxisSatisfies = (x <= p.roots[0] || x >= p.roots[1]);
                    } else if (p.roots.length === 1) {
                        onAxisSatisfies = true;
                    } else {
                        onAxisSatisfies = true;
                    }
                } else if (rel === "<") {
                    if (p.roots.length === 2) {
                        onAxisSatisfies = (x > p.roots[0] && x < p.roots[1]);
                    } else {
                        onAxisSatisfies = false;
                    }
                } else if (rel === "<=") {
                    if (p.roots.length === 2) {
                        onAxisSatisfies = (x >= p.roots[0] && x <= p.roots[1]);
                    } else if (p.roots.length === 1) {
                        onAxisSatisfies = Math.abs(x - p.roots[0]) <= 0.05;
                    } else {
                        onAxisSatisfies = false;
                    }
                }

                if (onAxisSatisfies) {
                    axisHighlightX.push(x);
                    axisHighlightY.push(0);
                } else {
                    axisHighlightX.push(null);
                    axisHighlightY.push(null);
                }
            }

            const endpointPoints = [];
            const isInclusive = (rel === "=" || rel === ">=" || rel === "<=");

            if (rel !== "=") {
                if (p.roots.length === 2) {
                    endpointPoints.push({ x: p.roots[0], y: 0, inclusive: isInclusive });
                    endpointPoints.push({ x: p.roots[1], y: 0, inclusive: isInclusive });
                } else if (p.roots.length === 1) {
                    endpointPoints.push({ x: p.roots[0], y: 0, inclusive: isInclusive });
                }
            } else {
                p.roots.forEach(r => {
                    endpointPoints.push({ x: r, y: 0, inclusive: true });
                });
            }

            const canvasEl = document.getElementById("graphCanvas");
            const ctx = canvasEl.getContext("2d");
            
            if (chartInstance !== null) {
                chartInstance.destroy();
                chartInstance = null;
            }

            const axisPlugin = {
                id: 'axisPlugin',
                beforeDraw: (chart) => {
                    const { ctx, chartArea, scales } = chart;
                    if (!chartArea) return;
                    
                    ctx.save();
                    
                    // Draw y=0 baseline (x-axis) with exact same thickness and color as y-axis
                    if (scales.y && scales.y.getValueForPixel) {
                        const yZeroPixel = scales.y.getPixelForValue(0);
                        if (yZeroPixel >= chartArea.top && yZeroPixel <= chartArea.bottom) {
                            ctx.beginPath();
                            ctx.strokeStyle = '#0f172a';
                            ctx.lineWidth = 3;
                            ctx.moveTo(chartArea.left, yZeroPixel);
                            ctx.lineTo(chartArea.right, yZeroPixel);
                            ctx.stroke();
                        }
                    }
                    
                    // Draw x=0 baseline (y-axis)
                    if (scales.x && scales.x.getValueForPixel) {
                        const xZeroPixel = scales.x.getPixelForValue(0);
                        if (xZeroPixel >= chartArea.left && xZeroPixel <= chartArea.right) {
                            ctx.beginPath();
                            ctx.strokeStyle = '#0f172a';
                            ctx.lineWidth = 3;
                            ctx.moveTo(xZeroPixel, chartArea.top);
                            ctx.lineTo(xZeroPixel, chartArea.bottom);
                            ctx.stroke();
                        }
                    }
                    
                    ctx.restore();
                }
            };

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: xValues,
                    datasets: [
                        {
                            label: 'y = f(x)',
                            data: yValues,
                            borderColor: '#4f46e5',
                            borderWidth: 3,
                            pointRadius: 0,
                            tension: 0.3,
                            fill: false,
                            order: 2
                        },
                        {
                            label: '条件を満たす範囲 (y)',
                            data: highlightRangeY,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.15)',
                            borderWidth: 2,
                            pointRadius: 0,
                            fill: true,
                            tension: 0.3,
                            order: 3
                        },
                        {
                            label: '解の範囲 (x軸上)',
                            data: axisHighlightY,
                            borderColor: '#ef4444',
                            borderWidth: 5,
                            pointRadius: 0,
                            fill: false,
                            order: 1
                        },
                        {
                            label: '端点',
                            type: 'scatter',
                            data: endpointPoints,
                            backgroundColor: (context) => {
                                const raw = context.raw;
                                return raw && raw.inclusive ? '#ef4444' : '#ffffff';
                            },
                            borderColor: '#ef4444',
                            borderWidth: 3,
                            pointRadius: 6,
                            pointHoverRadius: 8,
                            order: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom',
                            min: -2,
                            max: 7,
                            ticks: { 
                                stepSize: 1,
                                align: 'center',
                                padding: 8,
                                callback: function(value) {
                                    return value.toString();
                                },
                                font: function(context) {
                                    if (!context || context.tick === undefined) return { size: 12, family: 'Inter' };
                                    const val = context.tick.value;
                                    if (p.roots.includes(val)) {
                                        return { size: 15, weight: 'bold', family: 'Inter' };
                                    }
                                    return { size: 12, family: 'Inter' };
                                },
                                color: function(context) {
                                    if (!context || context.tick === undefined) return '#64748b';
                                    const val = context.tick.value;
                                    if (p.roots.includes(val)) {
                                        return '#ef4444';
                                    }
                                    return '#64748b';
                                }
                            },
                            grid: {
                                color: '#e2e8f0',
                                lineWidth: 1,
                                drawTicks: true
                            }
                        },
                        y: {
                            min: -11,
                            max: 13,
                            ticks: { 
                                stepSize: 3, 
                                font: { size: 12, family: 'Inter' } 
                            },
                            grid: {
                                color: '#e2e8f0',
                                lineWidth: 1,
                                drawTicks: true
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'bottom',
                            labels: {
                                boxWidth: 12,
                                font: { size: 12, family: 'Inter' },
                                filter: (legendItem) => legendItem.text !== '端点'
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: (context) => {
                                    if (context.dataset.type === 'scatter') {
                                        const raw = context.raw;
                                        const inclusive = raw ? raw.inclusive : true;
                                        return `端点 x = ${context.parsed.x} (${inclusive ? '含む' : '含まず'})`;
                                    }
                                    return `x = ${context.parsed.x}, y = ${context.parsed.y.toFixed(2)}`;
                                }
                            }
                        }
                    }
                },
                plugins: [axisPlugin]
            });

            const solutionContainer = document.getElementById("solution-container");
            solutionContainer.classList.remove('fade-in');
            void solutionContainer.offsetWidth;
            solutionContainer.classList.add('fade-in');
            generateSolutionText(p, rel);
        }

        function generateSolutionText(p, rel) {
            const container = document.getElementById("solution-content");
            let html = "";

            if (currentPresetIndex === 0) {
                if (rel === "=") {
                    html = `<p class="font-semibold text-slate-800">方程式の解:</p>
                            <p class="mt-0.5 text-slate-600">(x + 1)(x - 5) = 0 より、<strong class="text-red-600 text-base font-bold">x = -1, 5</strong></p>`;
                } else if (rel === ">") {
                    html = `<p class="font-semibold text-slate-800">不等式の解:</p>
                            <p class="mt-0.5 text-slate-600">グラフがx軸より上側より、<strong class="text-red-600 text-base font-bold">x < -1, 5 < x</strong></p>`;
                } else if (rel === ">=") {
                    html = `<p class="font-semibold text-slate-800">不等式の解:</p>
                            <p class="mt-0.5 text-slate-600">グラフがx軸上または上側より、<strong class="text-red-600 text-base font-bold">x ≦ -1, 5 ≦ x</strong></p>`;
                } else if (rel === "<") {
                    html = `<p class="font-semibold text-slate-800">不等式の解:</p>
                            <p class="mt-0.5 text-slate-600">グラフがx軸より下側より、<strong class="text-red-600 text-base font-bold">-1 < x < 5</strong></p>`;
                } else if (rel === "<=") {
                    html = `<p class="font-semibold text-slate-800">不等式の解:</p>
                            <p class="mt-0.5 text-slate-600">グラフがx軸上または下側より、<strong class="text-red-600 text-base font-bold">-1 ≦ x ≦ 5</strong></p>`;
                }
            } else if (currentPresetIndex === 1) {
                if (rel === "=") {
                    html = `<p class="font-semibold text-slate-800">方程式の解:</p>
                            <p class="mt-0.5 text-slate-600">(x - 3)² = 0 より、<strong class="text-red-600 text-base font-bold">x = 3 (重解)</strong></p>`;
                } else if (rel === ">") {
                    html = `<p class="font-semibold text-slate-800">不等式の解:</p>
                            <p class="mt-0.5 text-slate-600">x = 3 以外のすべての実数 (<strong class="text-red-600 text-base font-bold">3以外のすべての実数</strong>)</p>`;
                } else if (rel === ">=") {
                    html = `<p class="font-semibold text-slate-800">不等式の解:</p>
                            <p class="mt-0.5 text-slate-600">すべての実数 (<strong class="text-red-600 text-base font-bold">すべての実数</strong>)</p>`;
                } else if (rel === "<") {
                    html = `<p class="font-semibold text-slate-800">不等式の解:</p>
                            <p class="mt-0.5 text-slate-600"><strong class="text-red-600 text-base font-bold">解なし</strong></p>`;
                } else if (rel === "<=") {
                    html = `<p class="font-semibold text-slate-800">不等式の解:</p>
                            <p class="mt-0.5 text-slate-600">y = 0 となる点のみより、<strong class="text-red-600 text-base font-bold">x = 3</strong></p>`;
                }
            } else if (currentPresetIndex === 2) {
                if (rel === "=") {
                    html = `<p class="font-semibold text-slate-800">方程式の解:</p>
                            <p class="mt-0.5 text-slate-600">実数解は存在しない (<strong class="text-red-600 text-base font-bold">解なし</strong>)</p>`;
                } else if (rel === ">") {
                    html = `<p class="font-semibold text-slate-800">不等式の解:</p>
                            <p class="mt-0.5 text-slate-600">常にx軸の上のため、<strong class="text-red-600 text-base font-bold">すべての実数</strong></p>`;
                } else if (rel === ">=") {
                    html = `<p class="font-semibold text-slate-800">不等式の解:</p>
                            <p class="mt-0.5 text-slate-600">すべての実数 (<strong class="text-red-600 text-base font-bold">すべての実数</strong>)</p>`;
                } else if (rel === "<") {
                    html = `<p class="font-semibold text-slate-800">不等式の解:</p>
                            <p class="mt-0.5 text-slate-600">下側の領域がないため、<strong class="text-red-600 text-base font-bold">解なし</strong></p>`;
                } else if (rel === "<=") {
                    html = `<p class="font-semibold text-slate-800">不等式の解:</p>
                            <p class="mt-0.5 text-slate-600">下側や交わる領域がないため、<strong class="text-red-600 text-base font-bold">解なし</strong></p>`;
                }
            }

            container.innerHTML = html;
        }
    </script>
</body>
</html>
