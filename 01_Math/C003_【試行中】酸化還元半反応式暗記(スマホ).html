<!DOCTYPE html>
<html lang="ja" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>化学 半反応式暗記マスター - スマホ版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        -webkit-tap-highlight-color: transparent;
        
        .formula-text sub, .formula-text sup {
            font-size: 0.65em;
            line-height: 0;
            position: relative;
            vertical-align: baseline;
        }
        .formula-text sup { top: -0.45em; }
        .formula-text sub { bottom: -0.2em; }

        .highlight-part {
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block;
        }

        @keyframes popIn {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .touch-active:active {
            transform: scale(0.98);
            opacity: 0.95;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 h-full flex flex-col font-sans overflow-hidden">

    <!-- App Header -->
    <header class="bg-slate-900 text-white border-b border-slate-800 shrink-0 z-50 px-3 py-2 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-lg bg-cyan-500/20 flex items-center justify-center text-cyan-400">
                <i class="fa-solid fa-flask-vial text-lg"></i>
            </div>
            <div>
                <h1 class="text-xs sm:text-sm font-extrabold tracking-tight leading-none text-slate-100">半反応式暗記マスター</h1>
                <span class="text-[10px] text-cyan-400 font-semibold">教科書掲載 全22反応・色変化対応</span>
            </div>
        </div>
        
        <!-- View Switcher Tabs -->
        <div class="flex bg-slate-800 p-0.5 rounded-lg border border-slate-700 text-xs">
            <button id="tab-flashcard" onclick="switchView('flashcard')" class="px-2.5 py-1 rounded-md font-bold bg-cyan-600 text-white transition flex items-center gap-1">
                <i class="fa-solid fa-cards-blank text-[11px]"></i> 暗記
            </button>
            <button id="tab-list" onclick="switchView('list')" class="px-2.5 py-1 rounded-md font-medium text-slate-400 hover:text-white transition flex items-center gap-1">
                <i class="fa-solid fa-list-check text-[11px]"></i> 一覧
            </button>
        </div>
    </header>

    <!-- Main Application View Area -->
    <main class="flex-1 relative flex flex-col min-h-0 bg-slate-950">

        <!-- ================= FLASHCARD VIEW ================= -->
        <div id="view-flashcard" class="flex-1 flex flex-col p-2.5 max-w-md mx-auto w-full min-h-0 justify-between gap-2">
            
            <!-- Top Controls Toolbar -->
            <div class="bg-slate-800/90 border border-slate-700/80 rounded-xl p-1.5 flex justify-between items-center gap-1 shrink-0 overflow-x-auto no-scrollbar">
                <!-- Category Selector -->
                <div class="flex p-0.5 bg-slate-900 rounded-lg text-[11px] font-semibold shrink-0">
                    <button onclick="setCategory('all')" id="btn-cat-all" class="px-2 py-1 rounded-md text-slate-100 bg-slate-700 transition">全22</button>
                    <button onclick="setCategory('ox')" id="btn-cat-ox" class="px-2 py-1 rounded-md text-slate-400 hover:text-blue-300 transition">酸化剤</button>
                    <button onclick="setCategory('red')" id="btn-cat-red" class="px-2 py-1 rounded-md text-slate-400 hover:text-rose-300 transition">還元剤</button>
                    <button onclick="setCategory('color')" id="btn-cat-color" class="px-2 py-1 rounded-md text-slate-400 hover:text-amber-300 transition flex items-center gap-1">
                        <i class="fa-solid fa-palette text-[10px] text-amber-400"></i> 色変化
                    </button>
                </div>
                
                <!-- Shuffle Toggle & Counter -->
                <div class="flex items-center gap-1.5 shrink-0 pr-1">
                    <button onclick="toggleRandomMode()" id="btn-random" class="px-2 py-1 rounded-lg text-[11px] border border-slate-700 bg-slate-800 text-slate-300 flex items-center gap-1 transition active:scale-95">
                        <i class="fa-solid fa-shuffle text-slate-500 text-[10px]" id="icon-random"></i> 
                        <span id="label-random">順送り</span>
                    </button>
                    <span class="text-xs font-bold text-cyan-400 font-mono" id="card-counter">1/22</span>
                </div>
            </div>

            <!-- Main Flashcard Container -->
            <div id="flashcard-box" 
                 class="flex-1 bg-slate-900 rounded-2xl border-2 border-slate-700 shadow-xl p-3.5 flex flex-col justify-between items-center relative overflow-hidden select-none touch-active cursor-pointer min-h-0" 
                 onclick="handleCardClick(event)">
                
                <!-- Card Header -->
                <div class="w-full flex justify-between items-start z-10 gap-2">
                    <div class="flex flex-col gap-1 items-start">
                        <div id="type-badge" class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold tracking-wide uppercase bg-blue-950 text-blue-300 border border-blue-800 flex items-center gap-1">
                            <i class="fa-solid fa-bolt text-[9px]"></i> 酸化剤
                        </div>
                    </div>

                    <div class="flex flex-col items-end">
                        <div class="flex items-center gap-1.5">
                            <button onclick="event.stopPropagation(); toggleHint();" class="px-2 py-0.5 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 rounded-lg text-[11px] font-bold transition flex items-center gap-1 active:scale-95">
                                <i class="fa-solid fa-lightbulb text-amber-400"></i> 酸化数
                            </button>
                        </div>
                        <div class="text-right mt-1">
                            <div id="item-title" class="text-base font-black text-white leading-tight">過マンガン酸カリウム</div>
                            <div id="item-note" class="text-[11px] font-bold text-slate-400">酸性条件</div>
                        </div>
                    </div>
                </div>

                <!-- Color Change Badge Indicator (Visible when colored reaction) -->
                <div id="color-badge-container" class="w-full z-10 my-1 bg-slate-950/80 border border-amber-500/30 rounded-xl p-2 flex flex-col items-center justify-center transition-all">
                    <div class="text-[10px] font-bold text-amber-400 flex items-center gap-1 mb-1">
                        <i class="fa-solid fa-palette"></i> 色の変化 (反応前 → 反応後)
                    </div>
                    <div id="color-chips" class="flex items-center justify-center gap-2 text-xs font-bold text-slate-200">
                        <!-- Dynamic color chips injected here -->
                    </div>
                </div>

                <!-- Hint Display Box -->
                <div id="hint-box" class="w-full h-7 flex items-center justify-center z-10 my-0.5 transition-all duration-200 opacity-0 invisible">
                    <span class="font-extrabold text-amber-400 text-xs">💡 酸化数変化:</span> <span id="hint-text" class="font-bold font-mono text-amber-100 text-xs ml-1"></span>
                </div>

                <!-- Card Body -->
                <div class="my-auto text-center w-full flex flex-col justify-center items-center py-1 z-10">
                    <div id="step-description" class="text-[11px] font-bold tracking-wide text-cyan-300 bg-cyan-950/80 px-3 py-1 rounded-full border border-cyan-800/50 mb-3 transition-all max-w-[95%] truncate">
                        Step 1: 反応前の物質
                    </div>

                    <div class="w-full py-2 px-1 text-center">
                        <div id="formula-display" class="formula-text font-black text-white leading-relaxed tracking-wide w-full flex flex-col justify-center items-center min-h-[64px]">
                        </div>
                    </div>
                    
                    <p class="text-[10px] text-slate-500 mt-1 flex items-center gap-1">
                        <i class="fa-solid fa-hand-pointer text-slate-600"></i> タップで次のステップへ
                    </p>
                </div>

                <!-- Card Footer -->
                <div class="w-full space-y-1 z-10">
                    <div class="flex justify-between items-center text-[10px] font-bold text-slate-400 px-0.5">
                        <span class="text-slate-500">ステップ完了度</span>
                        <span id="step-number-text" class="text-cyan-400 font-mono">1 / 5</span>
                    </div>
                    <div id="step-dots" class="grid grid-cols-5 gap-1.5 h-1.5">
                    </div>
                </div>

                <!-- Background Glow -->
                <div id="bg-glow" class="absolute -right-10 -bottom-10 w-40 h-40 bg-blue-600/10 rounded-full blur-2xl pointer-events-none"></div>
            </div>

            <!-- Navigation Control Panel -->
            <div class="grid grid-cols-12 gap-2 shrink-0">
                <button onclick="prevCard()" class="col-span-3 bg-slate-800 active:bg-slate-700 text-slate-200 border border-slate-700 font-bold py-2.5 px-2 rounded-xl shadow-md text-xs transition flex flex-col items-center justify-center gap-0.5 active:scale-95">
                    <i class="fa-solid fa-chevron-left text-xs text-slate-400"></i>
                    <span>前へ</span>
                </button>
                
                <button onclick="nextStep()" class="col-span-6 bg-gradient-to-r from-emerald-600 to-teal-600 active:from-emerald-500 active:to-teal-500 text-white font-extrabold py-2.5 px-3 rounded-xl shadow-lg shadow-emerald-950/40 text-xs sm:text-sm transition flex items-center justify-center gap-2 active:scale-95 border border-emerald-500/30">
                    <span id="btn-next-step-label">次へ進む</span>
                    <i class="fa-solid fa-circle-chevron-right text-sm"></i>
                </button>

                <button onclick="nextCard()" class="col-span-3 bg-slate-800 active:bg-slate-700 text-slate-200 border border-slate-700 font-bold py-2.5 px-2 rounded-xl shadow-md text-xs transition flex flex-col items-center justify-center gap-0.5 active:scale-95">
                    <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
                    <span>次へ</span>
                </button>
            </div>

            <div class="text-center text-[10px] text-slate-500 pt-0.5 shrink-0">
                <span>👈 左右スワイプで物質切替 ｜ タップで分解手順 👉</span>
            </div>

        </div>

        <!-- ================= LIST VIEW ================= -->
        <div id="view-list" class="hidden absolute inset-0 flex flex-col p-3 max-w-md mx-auto w-full h-full overflow-hidden">
            
            <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 flex justify-between items-center shrink-0 mb-2 shadow-md">
                <h2 class="font-extrabold text-xs sm:text-sm text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-book-open text-cyan-400"></i> 教科書記載 全22種一覧
                </h2>
                <span class="text-xs bg-slate-900 text-cyan-400 font-mono font-bold px-2 py-0.5 rounded-full border border-slate-700">全22式</span>
            </div>

            <!-- Scrollable List Container -->
            <div class="flex-1 overflow-y-auto no-scrollbar space-y-3 pb-12">
                
                <!-- Oxidizing Agents Section -->
                <div class="bg-slate-900 rounded-xl border border-blue-900/60 overflow-hidden shadow-md">
                    <div class="bg-blue-950 px-3 py-1.5 text-blue-300 font-extrabold text-xs flex justify-between items-center border-b border-blue-900/50">
                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-bolt text-blue-400"></i> 酸化剤 (e⁻を受け取る)</span>
                        <span class="text-[10px] bg-blue-900/80 text-blue-200 px-1.5 py-0.5 rounded">12式</span>
                    </div>
                    <div class="divide-y divide-slate-800/80" id="list-ox-items">
                    </div>
                </div>

                <!-- Reducing Agents Section -->
                <div class="bg-slate-900 rounded-xl border border-rose-900/60 overflow-hidden shadow-md">
                    <div class="bg-rose-950 px-3 py-1.5 text-rose-300 font-extrabold text-xs flex justify-between items-center border-b border-rose-900/50">
                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-fire text-rose-400"></i> 還元剤 (e⁻を放出する)</span>
                        <span class="text-[10px] bg-rose-900/80 text-rose-200 px-1.5 py-0.5 rounded">10式</span>
                    </div>
                    <div class="divide-y divide-slate-800/80" id="list-red-items">
                    </div>
                </div>

            </div>
        </div>

    </main>

    <script>
        // High School Chemistry Dataset (All 22 textbook reactions + precise color changes)
        const REACTION_DATA = [

        // App State
        let currentCategory = 'all'; // 'all', 'ox', 'red', 'color'
        let isRandom = false;
        let activeList = [];
        let currentIndex = 0;
        let currentStep = 0;
        let isHintVisible = false;

        // Touch Swipe Logic
        let touchStartX = 0;
        let touchStartY = 0;

        window.onload = function() {
            filterData();
            renderList();
            updateCardDisplay();

            const flashcardBox = document.getElementById('flashcard-box');
            
            flashcardBox.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: true });

            flashcardBox.addEventListener('touchend', function(e) {
                const touchEndX = e.changedTouches[0].screenX;
                const touchEndY = e.changedTouches[0].screenY;
                handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
            }, { passive: true });

            document.addEventListener('keydown', function(e) {
                if (document.getElementById('view-flashcard').classList.contains('hidden')) return;
                
                if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'Enter') {
                    e.preventDefault();
                    nextStep();
                } else if (e.code === 'ArrowRight') {
                    e.preventDefault();
                    nextCard();
                } else if (e.code === 'ArrowLeft') {
                    e.preventDefault();
                    prevCard();
                }
            });
        };

        function handleSwipe(startX, startY, endX, endY) {
            const diffX = endX - startX;
            const diffY = endY - startY;

            if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
                if (diffX < 0) {
                    nextCard();
                } else {
                    prevCard();
                }
            }
        }

        // View Switcher
        function switchView(view) {
            const fcView = document.getElementById('view-flashcard');
            const listView = document.getElementById('view-list');
            const tabFc = document.getElementById('tab-flashcard');
            const tabList = document.getElementById('tab-list');

            if (view === 'flashcard') {
                fcView.classList.remove('hidden');
                listView.classList.add('hidden');
                tabFc.className = "px-2.5 py-1 rounded-md font-bold bg-cyan-600 text-white transition flex items-center gap-1";
                tabList.className = "px-2.5 py-1 rounded-md font-medium text-slate-400 hover:text-white transition flex items-center gap-1";
            } else {
                fcView.classList.add('hidden');
                listView.classList.remove('hidden');
                tabList.className = "px-2.5 py-1 rounded-md font-bold bg-cyan-600 text-white transition flex items-center gap-1";
                tabFc.className = "px-2.5 py-1 rounded-md font-medium text-slate-400 hover:text-white transition flex items-center gap-1";
            }
        }

        // Category Filter
        function setCategory(cat) {
            currentCategory = cat;
            
            ['all', 'ox', 'red', 'color'].forEach(c => {
                const btn = document.getElementById(`btn-cat-${c}`);
                if (c === cat) {
                    btn.className = `px-2 py-1 rounded-md text-white font-bold transition ${
                        c === 'ox' ? 'bg-blue-600' : 
                        c === 'red' ? 'bg-rose-600' : 
                        c === 'color' ? 'bg-amber-600' : 'bg-slate-700'
                    }`;
                } else {
                    btn.className = `px-2 py-1 rounded-md text-slate-400 hover:text-slate-200 transition`;
                }
            });

            filterData();
            currentIndex = 0;
            currentStep = 0;
            updateCardDisplay();
        }

        function filterData() {
            if (currentCategory === 'all') {
                activeList = [...REACTION_DATA];
            } else if (currentCategory === 'color') {
                activeList = REACTION_DATA.filter(item => item.colorChange !== null);
            } else {
                activeList = REACTION_DATA.filter(item => item.category === currentCategory);
            }

            if (isRandom) {
                shuffleArray(activeList);
            }
        }

        function toggleRandomMode() {
            isRandom = !isRandom;
            const btn = document.getElementById('btn-random');
            const icon = document.getElementById('icon-random');
            const label = document.getElementById('label-random');

            if (isRandom) {
                btn.classList.add('bg-slate-700', 'text-cyan-400', 'border-cyan-500/50');
                btn.classList.remove('bg-slate-800', 'text-slate-300');
                icon.className = 'fa-solid fa-shuffle text-cyan-400';
                label.textContent = 'シャッフル';
            } else {
                btn.classList.remove('bg-slate-700', 'text-cyan-400', 'border-cyan-500/50');
                btn.classList.add('bg-slate-800', 'text-slate-300');
                icon.className = 'fa-solid fa-shuffle text-slate-500';
                label.textContent = '順送り';
            }

            filterData();
            currentIndex = 0;
            currentStep = 0;
            updateCardDisplay();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function toggleHint() {
            isHintVisible = !isHintVisible;
            const hintBox = document.getElementById('hint-box');
            if (!hintBox) return;
            if (isHintVisible) {
                hintBox.classList.remove('opacity-0', 'invisible');
                hintBox.classList.add('opacity-100', 'visible');
            } else {
                hintBox.classList.add('opacity-0', 'invisible');
                hintBox.classList.remove('opacity-100', 'visible');
            }
        }

        function hideHint() {
            isHintVisible = false;
            const hintBox = document.getElementById('hint-box');
            if (hintBox) {
                hintBox.classList.add('opacity-0', 'invisible');
                hintBox.classList.remove('opacity-100', 'visible');
            }
        }

        // Update Flashcard UI Content
        function updateCardDisplay() {
            if (activeList.length === 0) return;

            hideHint();

            const item = activeList[currentIndex];
            const stepObj = item.steps[currentStep];

            const cardBox = document.getElementById('flashcard-box');
            const typeBadge = document.getElementById('type-badge');
            const bgGlow = document.getElementById('bg-glow');

            document.getElementById('hint-text').textContent = item.hint || "";

            // Theme Accent Colors
            if (item.category === 'ox') {
                cardBox.style.borderColor = '#1e40af';
                typeBadge.className = "px-2.5 py-0.5 rounded-full text-[10px] font-extrabold tracking-wide uppercase bg-blue-950 text-blue-300 border border-blue-800 flex items-center gap-1";
                typeBadge.innerHTML = "<i class='fa-solid fa-bolt text-[9px] text-blue-400'></i> 酸化剤";
                bgGlow.className = "absolute -right-10 -bottom-10 w-48 h-48 bg-blue-600/10 rounded-full blur-2xl pointer-events-none";
            } else {
                cardBox.style.borderColor = '#9f1239';
                typeBadge.className = "px-2.5 py-0.5 rounded-full text-[10px] font-extrabold tracking-wide uppercase bg-rose-950 text-rose-300 border border-rose-800 flex items-center gap-1";
                typeBadge.innerHTML = "<i class='fa-solid fa-fire text-[9px] text-rose-400'></i> 還元剤";
                bgGlow.className = "absolute -right-10 -bottom-10 w-48 h-48 bg-rose-600/10 rounded-full blur-2xl pointer-events-none";
            }

            // Color Change Indicator Display
            const colorContainer = document.getElementById('color-badge-container');
            const colorChips = document.getElementById('color-chips');

            if (item.colorChange) {
                colorContainer.classList.remove('hidden');
                colorChips.innerHTML = `
                    <div class="flex items-center gap-1.5 bg-slate-900 border border-slate-700 px-2 py-0.5 rounded-md">
                        <span class="w-2.5 h-2.5 rounded-full inline-block border border-slate-600 shadow-sm" style="background-color: ${item.colorChange.fromBg};"></span>
                        <span class="text-slate-200 text-[11px]">${item.colorChange.from}</span>
                    </div>
                    <i class="fa-solid fa-right-long text-amber-400 text-xs"></i>
                    <div class="flex items-center gap-1.5 bg-slate-900 border border-slate-700 px-2 py-0.5 rounded-md">
                        <span class="w-2.5 h-2.5 rounded-full inline-block border border-slate-600 shadow-sm" style="background-color: ${item.colorChange.toBg};"></span>
                        <span class="text-slate-200 text-[11px]">${item.colorChange.to}</span>
                    </div>
                `;
            } else {
                colorContainer.classList.add('hidden');
            }

            // Labels and Counters
            document.getElementById('item-title').textContent = item.name;
            document.getElementById('item-note').textContent = item.condition || "";
            document.getElementById('card-counter').textContent = `${currentIndex + 1}/${activeList.length}`;

            // Step Description
            document.getElementById('step-description').textContent = stepObj.desc;

            // Chemical Equation Layout
            const formulaDisplay = document.getElementById('formula-display');
            formulaDisplay.innerHTML = `
                <div class="text-base sm:text-lg font-bold text-slate-100 tracking-wide break-words max-w-full leading-relaxed px-1">
                    ${stepObj.html}
                </div>
            `;

            // Step Indicator Dots
            const totalSteps = item.steps.length;
            document.getElementById('step-number-text').textContent = `${currentStep + 1} / ${totalSteps}`;

            const dotsContainer = document.getElementById('step-dots');
            dotsContainer.innerHTML = '';
            
            for (let i = 0; i < totalSteps; i++) {
                const dot = document.createElement('div');
                dot.className = `h-full rounded-full transition-all duration-300 ${
                    i <= currentStep 
                        ? (item.category === 'ox' ? 'bg-blue-500 shadow-sm shadow-blue-500/50' : 'bg-rose-500 shadow-sm shadow-rose-500/50') 
                        : 'bg-slate-800'
                }`;
                dotsContainer.appendChild(dot);
            }

            // Button Label
            const nextBtnLabel = document.getElementById('btn-next-step-label');
            if (currentStep < totalSteps - 1) {
                nextBtnLabel.textContent = "次ステップ";
            } else {
                nextBtnLabel.textContent = "次の物質";
            }
        }

        function handleCardClick(e) {
            nextStep();
        }

        function nextStep() {
            if (activeList.length === 0) return;
            const item = activeList[currentIndex];

            if (currentStep < item.steps.length - 1) {
                currentStep++;
            } else {
                currentStep = 0;
                currentIndex = (currentIndex + 1) % activeList.length;
            }
            updateCardDisplay();
        }

        function prevCard() {
            if (activeList.length === 0) return;
            currentStep = 0;
            currentIndex = (currentIndex - 1 + activeList.length) % activeList.length;
            updateCardDisplay();
        }

        function nextCard() {
            if (activeList.length === 0) return;
            currentStep = 0;
            currentIndex = (currentIndex + 1) % activeList.length;
            updateCardDisplay();
        }

        // Render List View Data
        function renderList() {
            const oxContainer = document.getElementById('list-ox-items');
            const redContainer = document.getElementById('list-red-items');

            oxContainer.innerHTML = '';
            redContainer.innerHTML = '';

            REACTION_DATA.forEach(item => {
                const lastStep = item.steps[item.steps.length - 1].html;
                let formattedStep = lastStep;
                if (lastStep.includes(' &rarr; ')) {
                    const parts = lastStep.split(' &rarr; ');
                    formattedStep = `${parts[0]} <span class="text-cyan-400 font-bold px-1">&rarr;</span> ${parts[1]}`;
                }

                let colorHtml = '';
                if (item.colorChange) {
                    colorHtml = `
                        <div class="mt-1 flex items-center gap-1.5 text-[10px] text-amber-300 font-bold bg-amber-950/60 border border-amber-800/50 px-2 py-0.5 rounded-md w-fit">
                            <i class="fa-solid fa-palette text-[9px]"></i>
                            <span>${item.colorChange.from}</span>
                            <i class="fa-solid fa-arrow-right text-[8px] text-amber-400"></i>
                            <span>${item.colorChange.to}</span>
                        </div>
                    `;
                }

                const row = document.createElement('div');
                row.className = "p-2.5 hover:bg-slate-800/50 transition flex flex-col space-y-1";
                row.innerHTML = `
                    <div class="flex justify-between items-center text-xs">
                        <div class="flex items-center gap-1.5">
                            <span class="font-black text-slate-100">${item.name}</span>
                            <span class="text-[10px] text-slate-400 font-mono bg-slate-800 px-1.5 py-0.2 rounded border border-slate-700">${item.condition}</span>
                        </div>
                        <span class="text-[10px] font-mono text-cyan-400 font-bold">${item.hint}</span>
                    </div>
                    <div class="formula-text text-xs sm:text-sm font-bold text-slate-200 overflow-x-auto no-scrollbar whitespace-nowrap pt-0.5">
                        ${formattedStep}
                    </div>
                    ${colorHtml}
                `;

                if (item.category === 'ox') {
                    oxContainer.appendChild(row);
                } else {
                    redContainer.appendChild(row);
                }
            });
        }
    </script>
</body>
</html>
