<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 結晶構造インタラクティブビジュアライザー</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col md:flex-row h-screen overflow-hidden">

    <!-- 3D View Container -->
    <div id="canvas-container" class="relative flex-1 h-full w-full">
        <!-- Quick Help Overlay -->
        <div class="absolute bottom-4 left-4 z-10 text-xs text-slate-400 bg-slate-900/60 backdrop-blur-sm px-3 py-2 rounded-lg border border-slate-800 pointer-events-none hidden sm:block">
            <p>💡 <span class="font-medium text-slate-300">操作方法:</span> ドラッグで回転 | ホイールで拡大・縮小 | 右ドラッグで移動</p>
        </div>
    </div>

    <!-- Right Sidebar Controls -->
    <div class="w-full md:w-96 bg-slate-800/90 backdrop-blur-lg border-t md:border-t-0 md:border-l border-slate-700 p-5 flex flex-col justify-between z-20 shadow-2xl h-2/5 md:h-full overflow-y-auto custom-scrollbar">
        <div class="space-y-6">
            
            <!-- Category Selection -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">結晶のタイプ</label>
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-cat-metal" onclick="selectCategory('metal')" class="py-2 px-3 rounded-lg text-sm font-medium transition-all bg-blue-600 text-white shadow-lg shadow-blue-600/30">
                        金属結晶
                    </button>
                    <button id="btn-cat-ionic" onclick="selectCategory('ionic')" class="py-2 px-3 rounded-lg text-sm font-medium transition-all bg-slate-700 text-slate-300 hover:bg-slate-600">
                        イオン/共有結合結晶
                    </button>
                </div>
            </div>

            <!-- Structure Selector (Buttons) -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">構造の選択</label>
                <div id="structure-buttons" class="grid grid-cols-1 gap-1.5">
                    <!-- Dynamic Buttons Generated in JS -->
                </div>
            </div>

            <!-- Slice / Section View Selection -->
            <div class="space-y-2 pt-2 border-t border-slate-700/60">
                <label class="block text-xs font-semibold text-cyan-400 uppercase tracking-wider">断面の表示（スライス）</label>
                <div class="grid grid-cols-2 gap-1.5" id="slice-buttons">
                    <button onclick="changeSlicePlane('none')" id="slice-btn-none" class="slice-btn text-xs py-1.5 px-2 rounded-lg font-medium transition-all bg-cyan-600 text-white shadow-md shadow-cyan-600/30 font-semibold">
                        全体表示
                    </button>
                    <button onclick="changeSlicePlane('100')" id="slice-btn-100" class="slice-btn text-xs py-1.5 px-2 rounded-lg font-medium transition-all bg-slate-700 text-slate-300 hover:bg-slate-600">
                        (100) 面
                    </button>
                    <button onclick="changeSlicePlane('110')" id="slice-btn-110" class="slice-btn text-xs py-1.5 px-2 rounded-lg font-medium transition-all bg-slate-700 text-slate-300 hover:bg-slate-600">
                        (110) 面対角
                    </button>
                    <button onclick="changeSlicePlane('111')" id="slice-btn-111" class="slice-btn text-xs py-1.5 px-2 rounded-lg font-medium transition-all bg-slate-700 text-slate-300 hover:bg-slate-600">
                        (111) 体対角
                    </button>
                </div>
                <p id="slice-desc" class="text-[11px] text-slate-400 italic mt-1 leading-tight">全体表示中です。</p>
            </div>

            <!-- Visual Controls -->
            <div class="space-y-4 pt-2 border-t border-slate-700/60">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">表示設定</h3>

                <!-- Atom Size Slider -->
                <div>
                    <div class="flex justify-between text-xs font-medium text-slate-300 mb-1">
                        <span>原子/イオンの大きさ (充填感)</span>
                        <span id="radius-val" class="text-cyan-400">100%</span>
                    </div>
                    <input type="range" id="radius-slider" min="0.2" max="1.0" step="0.02" value="1.0" oninput="updateAtomRadius(this.value)" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-400">
                </div>

                <!-- Toggle Options -->
                <div class="space-y-2">
                    <label class="flex items-center justify-between p-2 rounded-lg bg-slate-900/50 cursor-pointer hover:bg-slate-900 transition-all border border-cyan-500/30">
                        <span class="text-sm font-medium text-cyan-300">単位格子内のみ表示</span>
                        <input type="checkbox" id="toggle-crop" onchange="toggleCropCell(this.checked)" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 bg-slate-800 border-slate-600">
                    </label>

                    <label class="flex items-center justify-between p-2 rounded-lg bg-slate-900/50 cursor-pointer hover:bg-slate-900 transition-all">
                        <span class="text-sm font-medium text-slate-300">単位格子枠線</span>
                        <input type="checkbox" id="toggle-unitcell" checked onchange="toggleUnitCell(this.checked)" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 bg-slate-800 border-slate-600">
                    </label>

                    <label class="flex items-center justify-between p-2 rounded-lg bg-slate-900/50 cursor-pointer hover:bg-slate-900 transition-all">
                        <span class="text-sm font-medium text-slate-300">結合・ネットワーク線</span>
                        <input type="checkbox" id="toggle-bonds" checked onchange="toggleBonds(this.checked)" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 bg-slate-800 border-slate-600">
                    </label>

                    <label class="flex items-center justify-between p-2 rounded-lg bg-slate-900/50 cursor-pointer hover:bg-slate-900 transition-all">
                        <span class="text-sm font-medium text-slate-300">複数の単位格子を表示 (2x2x2)</span>
                        <input type="checkbox" id="toggle-supercell" onchange="toggleSupercell(this.checked)" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 bg-slate-800 border-slate-600">
                    </label>
                </div>
            </div>

            <!-- Detailed Info Panel -->
            <div id="info-card" class="bg-slate-900/80 rounded-xl p-4 border border-slate-700/80 space-y-3">
                <h4 class="text-xs font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-1.5">
                    <i data-lucide="info" class="w-4 h-4"></i> 構造の特徴
                </h4>
                <div id="info-content" class="text-xs text-slate-300 space-y-2 leading-relaxed">
                    <!-- Dynamic Info -->
                </div>
            </div>

        </div>

        <!-- Footer -->
        <div class="pt-4 border-t border-slate-700/60 text-center text-[10px] text-slate-500">
            Interactive 3D Crystal Lattice Visualizer
        </div>
    </div>

    <script>
        // --- Color Definitions ---
        const COLORS = {
            metal: 0x38bdf8,   // Sky Blue
            cation: 0xef4444,  // Red (e.g. Na+, Cs+, Zn2+)
            anion: 0x3b82f6,   // Blue (e.g. Cl-, S2-)
            diamond: 0x38bdf8, // Sky Blue / Carbon
            unitCell: 0x94a3b8,// Slate light
            bond: 0x64748b     // Slate dark
        };

        // --- Crystal Structure Data Definitions ---
        const DATA = {
            metal: [
                {
                    id: 'fcc',
                    name: '面心立方格子 (FCC)',
                    sub: 'Face-Centered Cubic',
                    coordination: '12',
                    packingRatio: '74%',
                    atomsInCell: '4個 (8×1/8 + 6×1/2)',
                    examples: 'Cu, Al, Au, Ag, Ni, Pb',
                    radiusScale: 0.35355, 
                    desc: '各頂点と8つの面の中心に原子が位置する構造です。最密充填構造（ABCABC...の積層）の一つで、充填率は最高レベルの74%です。',
                    sliceInfos: {
                        '100': '(100)面：各辺の原子と中央の面心原子を通る正方形配列です。',
                        '110': '(110)面：対角線上の面心原子と頂点原子を結ぶ長方形の断面です。',
                        '111': '(111)面：最も原子密度が高い最密面（正三角形パターン）が現れます。'
                    },
                    getAtoms: () => {
                        const atoms = [];
                        for(let x of [0, 1]) for(let y of [0, 1]) for(let z of [0, 1]) {
                            atoms.push({ pos: [x, y, z], type: 'metal' });
                        }
                        atoms.push({ pos: [0.5, 0.5, 0], type: 'metal' });
                        atoms.push({ pos: [0.5, 0.5, 1], type: 'metal' });
                        atoms.push({ pos: [0.5, 0, 0.5], type: 'metal' });
                        atoms.push({ pos: [0.5, 1, 0.5], type: 'metal' });
                        atoms.push({ pos: [0, 0.5, 0.5], type: 'metal' });
                        atoms.push({ pos: [1, 0.5, 0.5], type: 'metal' });
                        return atoms;
                    }
                },
                {
                    id: 'bcc',
                    name: '体心立方格子 (BCC)',
                    sub: 'Body-Centered Cubic',
                    coordination: '8',
                    packingRatio: '68%',
                    atomsInCell: '2個 (8×1/8 + 1)',
                    examples: 'Fe, Na, K, Ba, W, Cr',
                    radiusScale: 0.43301, 
                    desc: '立方体の8つの頂点と中心（体心）に1個の原子が存在します。面心立方格子よりも隙間が多く、充填率は68%です。',
                    sliceInfos: {
                        '100': '(100)面：頂点の原子のみが現れる正方形の配列です。',
                        '110': '(110)面：中心原子と対角上の頂点原子を貫く、最も密な最密面です。',
                        '111': '(111)面：体対角線に直交する方向の断面です。'
                    },
                    getAtoms: () => {
                        const atoms = [];
                        for(let x of [0, 1]) for(let y of [0, 1]) for(let z of [0, 1]) {
                            atoms.push({ pos: [x, y, z], type: 'metal' });
                        }
                        atoms.push({ pos: [0.5, 0.5, 0.5], type: 'metal' });
                        return atoms;
                    }
                },
                {
                    id: 'hcp',
                    name: '六方最密充填 (HCP)',
                    sub: 'Hexagonal Close-Packed',
                    coordination: '12',
                    packingRatio: '74%',
                    atomsInCell: '2個（六角柱全体では6個）',
                    examples: 'Mg, Zn, Ti, Cd, Be',
                    isHexagonal: true,
                    radiusScale: 0.5, 
                    desc: '六角柱の底面・上面の中央と各頂点、および中央層に3個の原子が入る構造です（ABAB...の積層）。FCCと同じ最高密度の74%です。',
                    sliceInfos: {
                        '100': '柱面での切断面です。',
                        '110': '対角方向での切断面です。',
                        '111': '底面（C面）に平行な最密層（六角配列）の断面です。'
                    },
                    getAtoms: () => {
                        const atoms = [];
                        const h = 1.633;
                        [0, h].forEach(y => {
                            atoms.push({ pos: [0, y, 0], type: 'metal' });
                            for(let i = 0; i < 6; i++) {
                                const angle = (i * 60) * Math.PI / 180;
                                atoms.push({ pos: [Math.cos(angle), y, Math.sin(angle)], type: 'metal' });
                            }
                        });
                        for(let i = 0; i < 3; i++) {
                            const angle = (i * 120 + 30) * Math.PI / 180;
                            const r = 0.577;
                            atoms.push({ pos: [r * Math.cos(angle), h / 2, r * Math.sin(angle)], type: 'metal' });
                        }
                        return atoms;
                    }
                }
            ],
            ionic: [
                {
                    id: 'nacl',
                    name: '塩化ナトリウム型 (NaCl)',
                    sub: 'Sodium Chloride Structure',
                    coordination: '6 : 6 (Na+:6, Cl-:6)',
                    packingRatio: '約66%',
                    atomsInCell: 'Na+: 4個, Cl-: 4個',
                    examples: 'NaCl, MgO, CaO, KCl, AgCl',
                    radiusScale: 0.33,
                    cationRatio: 0.515,
                    desc: 'Cl- (陰イオン) が面心立方格子を組み、そのすき間（オクタヒドラル体心および各辺の中点）に Na+ (陽イオン) が収まった構造です。',
                    sliceInfos: {
                        '100': '(100)面：Na+ と Cl- が交互に並ぶ正方形格子面です。',
                        '110': '(110)面：対角線上に同種イオンと異種イオンの列が走る断面です。',
                        '111': '(111)面：すべて Na+ の面とすべて Cl- の面が交互に層をなす面です。'
                    },
                    getAtoms: () => {
                        const atoms = [];
                        for(let x of [0, 1]) for(let y of [0, 1]) for(let z of [0, 1]) {
                            atoms.push({ pos: [x, y, z], type: 'anion' });
                        }
                        atoms.push({ pos: [0.5, 0.5, 0], type: 'anion' });
                        atoms.push({ pos: [0.5, 0.5, 1], type: 'anion' });
                        atoms.push({ pos: [0.5, 0, 0.5], type: 'anion' });
                        atoms.push({ pos: [0.5, 1, 0.5], type: 'anion' });
                        atoms.push({ pos: [0, 0.5, 0.5], type: 'anion' });
                        atoms.push({ pos: [1, 0.5, 0.5], type: 'anion' });

                        atoms.push({ pos: [0.5, 0.5, 0.5], type: 'cation' });
                        const edges = [
                            [0.5, 0, 0], [0.5, 1, 0], [0.5, 0, 1], [0.5, 1, 1],
                            [0, 0.5, 0], [1, 0.5, 0], [0, 0.5, 1], [1, 0.5, 1],
                            [0, 0, 0.5], [1, 0, 0.5], [0, 1, 0.5], [1, 1, 0.5]
                        ];
                        edges.forEach(pos => atoms.push({ pos, type: 'cation' }));
                        return atoms;
                    }
                },
                {
                    id: 'cscl',
                    name: '塩化セシウム型 (CsCl)',
                    sub: 'Cesium Chloride Structure',
                    coordination: '8 : 8 (Cs+:8, Cl-:8)',
                    packingRatio: '約68%',
                    atomsInCell: 'Cs+: 1個, Cl-: 1個',
                    examples: 'CsCl, CsBr, CsI, NH4Cl',
                    radiusScale: 0.45,
                    cationRatio: 0.92,
                    desc: 'Cl- が立方体の頂点に位置し、中央の体に Cs+ が1個入る体心立方構造に類似した非常にシンプルな格子です。',
                    sliceInfos: {
                        '100': '(100)面：頂点の Cl- イオンのみが見える面です。',
                        '110': '(110)面：中央の Cs+ と対角の Cl- が直接接する最密接触面です。',
                        '111': '(111)面：Cl- 面の層を切り取る断面です。'
                    },
                    getAtoms: () => {
                        const atoms = [];
                        for(let x of [0, 1]) for(let y of [0, 1]) for(let z of [0, 1]) {
                            atoms.push({ pos: [x, y, z], type: 'anion' });
                        }
                        atoms.push({ pos: [0.5, 0.5, 0.5], type: 'cation' });
                        return atoms;
                    }
                },
                {
                    id: 'zns',
                    name: '閃亜鉛鉱型 (ZnS)',
                    sub: 'Zinc Blende Structure',
                    coordination: '4 : 4 (Zn2+:4, S2-:4)',
                    packingRatio: '約34%',
                    atomsInCell: 'Zn2+: 4個, S2-: 4個',
                    examples: 'ZnS, GaAs, SiC',
                    radiusScale: 0.28,
                    cationRatio: 0.55,
                    desc: 'S2- が面心立方格子を構成し、内部の8個あるテトラヒドラル隙間のうち交互に4箇所へ Zn2+ が入る共有結合性の強い構造です。',
                    sliceInfos: {
                        '100': '(100)面：S2- の正方形格子と内部の Zn2+ を一方向に投影した面です。',
                        '110': '(110)面：S2- と Zn2+ の四面体結合ネットワーク（正四面体配位）が確認できる面です。',
                        '111': '(111)面：最密層と四面体隙間位置の層構造が観察できます。'
                    },
                    getAtoms: () => {
                        const atoms = [];
                        for(let x of [0, 1]) for(let y of [0, 1]) for(let z of [0, 1]) {
                            atoms.push({ pos: [x, y, z], type: 'anion' });
                        }
                        atoms.push({ pos: [0.5, 0.5, 0], type: 'anion' });
                        atoms.push({ pos: [0.5, 0.5, 1], type: 'anion' });
                        atoms.push({ pos: [0.5, 0, 0.5], type: 'anion' });
                        atoms.push({ pos: [0.5, 1, 0.5], type: 'anion' });
                        atoms.push({ pos: [0, 0.5, 0.5], type: 'anion' });
                        atoms.push({ pos: [1, 0.5, 0.5], type: 'anion' });

                        const tSites = [
                            [0.25, 0.25, 0.25],
                            [0.75, 0.75, 0.25],
                            [0.75, 0.25, 0.75],
                            [0.25, 0.75, 0.75]
                        ];
                        tSites.forEach(pos => atoms.push({ pos, type: 'cation' }));
                        return atoms;
                    }
                },
                {
                    id: 'diamond',
                    name: 'ダイヤモンド構造 (C)',
                    sub: 'Diamond Cubic Structure',
                    coordination: '4',
                    packingRatio: '34%',
                    atomsInCell: '8個 (FCC 4個 + 四面体隙間 4個)',
                    examples: 'ダイヤモンド(C), 珪素(Si), ゲルマニウム(Ge), 灰錫(α-Sn)',
                    radiusScale: 0.216,
                    desc: '炭素原子が正四面体頂点方向の4つの原子と強固な共有結合を形成する構造です。面心立方格子(FCC)の配置に加え、内部の8つの四面体隙間のうち4箇所に同種の原子が入っています。',
                    sliceInfos: {
                        '100': '(100)面：正方形配列格子と内部原子の投影面です。',
                        '110': '(110)面：正四面体結合（テトラヒドラル配位）がギザギザ状の鎖として直視できる断面です。',
                        '111': '(111)面：最密面方向の層構造と四面体間隙層が交互に並ぶ断面です。'
                    },
                    getAtoms: () => {
                        const atoms = [];
                        for(let x of [0, 1]) for(let y of [0, 1]) for(let z of [0, 1]) {
                            atoms.push({ pos: [x, y, z], type: 'diamond' });
                        }
                        atoms.push({ pos: [0.5, 0.5, 0], type: 'diamond' });
                        atoms.push({ pos: [0.5, 0.5, 1], type: 'diamond' });
                        atoms.push({ pos: [0.5, 0, 0.5], type: 'diamond' });
                        atoms.push({ pos: [0.5, 1, 0.5], type: 'diamond' });
                        atoms.push({ pos: [0, 0.5, 0.5], type: 'diamond' });
                        atoms.push({ pos: [1, 0.5, 0.5], type: 'diamond' });

                        const tSites = [
                            [0.25, 0.25, 0.25],
                            [0.75, 0.75, 0.25],
                            [0.75, 0.25, 0.75],
                            [0.25, 0.75, 0.75]
                        ];
                        tSites.forEach(pos => atoms.push({ pos, type: 'diamond' }));
                        return atoms;
                    }
                }
            ]
        };

        // --- Application State ---
        let currentCategory = 'metal';
        let currentStructure = DATA.metal[0];
        let currentRadiusScale = 1.0;
        let showUnitCell = true;
        let showBonds = true;
        let showSupercell = false;
        let cropToUnitCell = false;
        let currentSlicePlane = 'none';

        // --- Three.js Globals ---
        let scene, camera, renderer, controls;
        let crystalGroup, unitCellGroup, bondsGroup, slicePlaneGroup, stencilGroup;
        let localClippingPlanes = [];

        // --- Initialize ---
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(2.5, 2.5, 4.5);

            renderer = new THREE.WebGLRenderer({ antialias: true, stencil: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.localClippingEnabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight1.position.set(5, 10, 7);
            dirLight1.castShadow = true;
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0x38bdf8, 0.3);
            dirLight2.position.set(-5, -5, -5);
            scene.add(dirLight2);

            crystalGroup = new THREE.Group();
            unitCellGroup = new THREE.Group();
            bondsGroup = new THREE.Group();
            slicePlaneGroup = new THREE.Group();
            stencilGroup = new THREE.Group();

            scene.add(crystalGroup);
            scene.add(unitCellGroup);
            scene.add(bondsGroup);
            scene.add(slicePlaneGroup);
            scene.add(stencilGroup);

            lucide.createIcons();
            selectCategory('metal');

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function buildCrystal() {
            clearGroup(crystalGroup);
            clearGroup(unitCellGroup);
            clearGroup(bondsGroup);
            clearGroup(slicePlaneGroup);
            clearGroup(stencilGroup);

            const atomsData = currentStructure.getAtoms();
            const baseRadius = currentStructure.radiusScale;

            let centerOffset = new THREE.Vector3(-0.5, -0.5, -0.5);
            if (currentStructure.isHexagonal) {
                centerOffset.set(0, -0.816, 0);
            }

            setupClippingPlanes();

            const range = showSupercell ? [0, 1] : [0];

            range.forEach(rx => {
                range.forEach(ry => {
                    range.forEach(rz => {
                        const cellOffset = new THREE.Vector3(rx, ry, rz);
                        
                        atomsData.forEach(atom => {
                            const pos = new THREE.Vector3(...atom.pos).add(cellOffset).add(centerOffset);
                            let radius = baseRadius * currentRadiusScale;
                            let color = COLORS.metal;
                            
                            if (atom.type === 'cation') {
                                color = COLORS.cation;
                                const ratio = currentStructure.cationRatio || 0.6;
                                radius *= ratio;
                            } else if (atom.type === 'anion') {
                                color = COLORS.anion;
                            } else if (atom.type === 'diamond') {
                                color = COLORS.diamond;
                            }

                            const sphereGeo = new THREE.SphereGeometry(radius, 32, 32);

                            if (localClippingPlanes.length > 0) {
                                createSolidClippedMesh(sphereGeo, pos, color, localClippingPlanes);
                            } else {
                                const sphereMat = new THREE.MeshStandardMaterial({
                                    color: color,
                                    roughness: 0.2,
                                    metalness: currentCategory === 'metal' ? 0.6 : 0.1
                                });
                                const mesh = new THREE.Mesh(sphereGeo, sphereMat);
                                mesh.position.copy(pos);
                                mesh.castShadow = true;
                                mesh.receiveShadow = true;
                                crystalGroup.add(mesh);
                            }
                        });

                        if (showUnitCell) {
                            if (currentStructure.isHexagonal) {
                                buildHexagonalCellWireframe(cellOffset.clone().add(centerOffset));
                            } else {
                                buildCubicCellWireframe(cellOffset.clone().add(centerOffset));
                            }
                        }
                    });
                });
            });

            if (showBonds) {
                buildBonds(atomsData, range, centerOffset, baseRadius * currentRadiusScale, localClippingPlanes);
            }
        }

        function createSolidClippedMesh(geometry, position, color, planes) {
            const group = new THREE.Group();
            group.position.copy(position);

            const matBack = new THREE.MeshBasicMaterial({
                colorWrite: false,
                depthWrite: false,
                clippingPlanes: planes,
                side: THREE.BackSide,
                stencilWrite: true,
                stencilFunc: THREE.AlwaysStencilFunc,
                stencilFail: THREE.KeepStencilOp,
                stencilZFail: THREE.KeepStencilOp,
                stencilZPass: THREE.IncrementWrapStencilOp
            });

            const matFront = new THREE.MeshBasicMaterial({
                colorWrite: false,
                depthWrite: false,
                clippingPlanes: planes,
                side: THREE.FrontSide,
                stencilWrite: true,
                stencilFunc: THREE.AlwaysStencilFunc,
                stencilFail: THREE.KeepStencilOp,
                stencilZFail: THREE.KeepStencilOp,
                stencilZPass: THREE.DecrementWrapStencilOp
            });

            const matSurface = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.2,
                metalness: currentCategory === 'metal' ? 0.6 : 0.1,
                clippingPlanes: planes,
                side: THREE.FrontSide
            });

            const meshBack = new THREE.Mesh(geometry, matBack);
            const meshFront = new THREE.Mesh(geometry, matFront);
            const meshSurface = new THREE.Mesh(geometry, matSurface);
            meshSurface.castShadow = true;
            meshSurface.receiveShadow = true;

            group.add(meshBack);
            group.add(meshFront);
            group.add(meshSurface);

            crystalGroup.add(group);

            const capMat = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.3,
                metalness: currentCategory === 'metal' ? 0.4 : 0.1,
                stencilWrite: true,
                stencilFunc: THREE.NotEqualStencilFunc,
                stencilRef: 0,
                stencilFail: THREE.ReplaceStencilOp,
                stencilZFail: THREE.ReplaceStencilOp,
                stencilZPass: THREE.ReplaceStencilOp
            });

            planes.forEach(plane => {
                const capGeo = new THREE.PlaneGeometry(6, 6);
                const capMesh = new THREE.Mesh(capGeo, capMat);

                const normal = plane.normal.clone();
                const planePoint = normal.clone().multiplyScalar(-plane.constant);
                capMesh.position.copy(planePoint);
                capMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal.negate());

                stencilGroup.add(capMesh);
            });
        }

        function setupClippingPlanes() {
            localClippingPlanes = [];

            if (currentSlicePlane !== 'none') {
                let normal = new THREE.Vector3(1, 0, 0);
                let size = 1.8;

                if (currentSlicePlane === '100') {
                    normal.set(1, 0, 0);
                } else if (currentSlicePlane === '110') {
                    normal.set(1, 1, 0).normalize();
                    size = 2.2;
                } else if (currentSlicePlane === '111') {
                    normal.set(1, 1, 1).normalize();
                    size = 2.4;
                }

                const slicePlane = new THREE.Plane(normal, 0);
                localClippingPlanes.push(slicePlane);

                const planeGeo = new THREE.PlaneGeometry(size, size);
                const planeMat = new THREE.MeshBasicMaterial({
                    color: 0x06b6d4,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.15,
                    depthWrite: false
                });
                const visualPlane = new THREE.Mesh(planeGeo, planeMat);
                visualPlane.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
                
                const edges = new THREE.EdgesGeometry(planeGeo);
                const lineMat = new THREE.LineBasicMaterial({ color: 0x22d3ee, linewidth: 2 });
                const border = new THREE.LineSegments(edges, lineMat);
                visualPlane.add(border);

                buildCutOutline(normal);
                slicePlaneGroup.add(visualPlane);
            }

            if (cropToUnitCell) {
                const maxCoord = showSupercell ? 1.5 : 0.5;
                const minCoord = -0.5;

                if (currentStructure.isHexagonal) {
                    const hHalf = 1.633 / 2;
                    localClippingPlanes.push(
                        new THREE.Plane(new THREE.Vector3(0, -1, 0), hHalf),
                        new THREE.Plane(new THREE.Vector3(0, 1, 0), hHalf)
                    );
                } else {
                    localClippingPlanes.push(
                        new THREE.Plane(new THREE.Vector3(-1, 0, 0), maxCoord),
                        new THREE.Plane(new THREE.Vector3(1, 0, 0), -minCoord),
                        new THREE.Plane(new THREE.Vector3(0, -1, 0), maxCoord),
                        new THREE.Plane(new THREE.Vector3(0, 1, 0), -minCoord),
                        new THREE.Plane(new THREE.Vector3(0, 0, -1), maxCoord),
                        new THREE.Plane(new THREE.Vector3(0, 0, 1), -minCoord)
                    );
                }
            }
        }

        function buildCutOutline(normal) {
            const lines = [];

            if (currentStructure.isHexagonal) {
                const h = 1.633;
                const topY = h / 2;
                const botY = -h / 2;
                const hexEdges = [];

                for (let i = 0; i < 6; i++) {
                    const a1 = (i * 60) * Math.PI / 180;
                    const a2 = ((i + 1) * 60) * Math.PI / 180;
                    const v1_bot = new THREE.Vector3(Math.cos(a1), botY, Math.sin(a1));
                    const v2_bot = new THREE.Vector3(Math.cos(a2), botY, Math.sin(a2));
                    const v1_top = new THREE.Vector3(Math.cos(a1), topY, Math.sin(a1));
                    const v2_top = new THREE.Vector3(Math.cos(a2), topY, Math.sin(a2));

                    hexEdges.push([v1_bot, v2_bot], [v1_top, v2_top]);
                    hexEdges.push([v1_bot, v1_top]);
                }

                findAndAddIntersections(hexEdges, normal, lines);
            } else {
                const cubicEdges = [
                    [new THREE.Vector3(-0.5,-0.5,-0.5), new THREE.Vector3(0.5,-0.5,-0.5)],
                    [new THREE.Vector3(0.5,-0.5,-0.5), new THREE.Vector3(0.5,0.5,-0.5)],
                    [new THREE.Vector3(0.5,0.5,-0.5), new THREE.Vector3(-0.5,0.5,-0.5)],
                    [new THREE.Vector3(-0.5,0.5,-0.5), new THREE.Vector3(-0.5,-0.5,-0.5)],

                    [new THREE.Vector3(-0.5,-0.5,0.5), new THREE.Vector3(0.5,-0.5,0.5)],
                    [new THREE.Vector3(0.5,-0.5,0.5), new THREE.Vector3(0.5,0.5,0.5)],
                    [new THREE.Vector3(0.5,0.5,0.5), new THREE.Vector3(-0.5,0.5,0.5)],
                    [new THREE.Vector3(-0.5,0.5,0.5), new THREE.Vector3(-0.5,-0.5,0.5)],

                    [new THREE.Vector3(-0.5,-0.5,-0.5), new THREE.Vector3(-0.5,-0.5,0.5)],
                    [new THREE.Vector3(0.5,-0.5,-0.5), new THREE.Vector3(0.5,-0.5,0.5)],
                    [new THREE.Vector3(0.5,0.5,-0.5), new THREE.Vector3(0.5,0.5,0.5)],
                    [new THREE.Vector3(-0.5,0.5,-0.5), new THREE.Vector3(-0.5,0.5,0.5)]
                ];

                findAndAddIntersections(cubicEdges, normal, lines);
            }

            if (lines.length > 0) {
                const geo = new THREE.BufferGeometry().setFromPoints(lines);
                const mat = new THREE.LineBasicMaterial({
                    color: 0x38bdf8,
                    linewidth: 3,
                    depthTest: false
                });
                const cutOutline = new THREE.LineSegments(geo, mat);
                slicePlaneGroup.add(cutOutline);
            }
        }

        function findAndAddIntersections(edges, normal, outPoints) {
            const plane = new THREE.Plane(normal, 0);
            const intersections = [];

            edges.forEach(([p1, p2]) => {
                const line = new THREE.Line3(p1, p2);
                const target = new THREE.Vector3();
                if (plane.intersectLine(line, target)) {
                    intersections.push(target.clone());
                }
            });

            if (intersections.length >= 3) {
                const centroid = new THREE.Vector3();
                intersections.forEach(p => centroid.add(p));
                centroid.divideScalar(intersections.length);

                const u = new THREE.Vector3();
                if (Math.abs(normal.x) > 0.9) u.set(0, 1, 0);
                else u.set(1, 0, 0);
                const v = new THREE.Vector3().crossVectors(normal, u).normalize();
                u.crossVectors(v, normal).normalize();

                intersections.sort((a, b) => {
                    const da = a.clone().sub(centroid);
                    const db = b.clone().sub(centroid);
                    const angleA = Math.atan2(da.dot(v), da.dot(u));
                    const angleB = Math.atan2(db.dot(v), db.dot(u));
                    return angleA - angleB;
                });

                for (let i = 0; i < intersections.length; i++) {
                    outPoints.push(intersections[i]);
                    outPoints.push(intersections[(i + 1) % intersections.length]);
                }
            }
        }

        function changeSlicePlane(val) {
            currentSlicePlane = val;

            const buttons = ['none', '100', '110', '111'];
            buttons.forEach(b => {
                const btn = document.getElementById(`slice-btn-${b}`);
                if (btn) {
                    if (b === val) {
                        btn.className = "slice-btn text-xs py-1.5 px-2 rounded-lg font-medium transition-all bg-cyan-600 text-white shadow-md shadow-cyan-600/30 font-semibold";
                    } else {
                        btn.className = "slice-btn text-xs py-1.5 px-2 rounded-lg font-medium transition-all bg-slate-700 text-slate-300 hover:bg-slate-600";
                    }
                }
            });

            const descEl = document.getElementById('slice-desc');
            
            if (val === 'none') {
                descEl.innerText = '全体表示中です。';
            } else if (currentStructure.sliceInfos && currentStructure.sliceInfos[val]) {
                descEl.innerText = currentStructure.sliceInfos[val];
            } else {
                descEl.innerText = `${val}面で結晶構造を切断表示しています。`;
            }

            buildCrystal();
        }

        function clearGroup(group) {
            while(group.children.length > 0){
                const obj = group.children[0];
                if(obj.geometry) obj.geometry.dispose();
                if(obj.material) {
                    if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                    else obj.material.dispose();
                }
                group.remove(obj);
            }
        }

        function buildCubicCellWireframe(offset) {
            const boxGeo = new THREE.BoxGeometry(1, 1, 1);
            const edges = new THREE.EdgesGeometry(boxGeo);
            const lineMat = new THREE.LineBasicMaterial({ color: COLORS.unitCell, linewidth: 2 });
            const wireframe = new THREE.LineSegments(edges, lineMat);
            wireframe.position.set(0.5, 0.5, 0.5).add(offset);
            unitCellGroup.add(wireframe);
        }

        function buildHexagonalCellWireframe(offset) {
            const h = 1.633;
            const points = [];
            
            for(let layer of [0, h]) {
                for(let i=0; i<6; i++) {
                    const a1 = (i * 60) * Math.PI / 180;
                    const a2 = ((i+1) * 60) * Math.PI / 180;
                    points.push(
                        new THREE.Vector3(Math.cos(a1), layer, Math.sin(a1)).add(offset),
                        new THREE.Vector3(Math.cos(a2), layer, Math.sin(a2)).add(offset)
                    );
                }
            }
            for(let i=0; i<6; i++) {
                const a = (i * 60) * Math.PI / 180;
                points.push(
                    new THREE.Vector3(Math.cos(a), 0, Math.sin(a)).add(offset),
                    new THREE.Vector3(Math.cos(a), h, Math.sin(a)).add(offset)
                );
            }

            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const lineMat = new THREE.LineBasicMaterial({ color: COLORS.unitCell, linewidth: 2 });
            const lines = new THREE.LineSegments(geo, lineMat);
            unitCellGroup.add(lines);
        }

        function buildBonds(atomsData, range, centerOffset, radius, clippingPlanes) {
            const allPos = [];
            range.forEach(rx => {
                range.forEach(ry => {
                    range.forEach(rz => {
                        const cellOffset = new THREE.Vector3(rx, ry, rz);
                        atomsData.forEach(a => {
                            allPos.push({
                                pos: new THREE.Vector3(...a.pos).add(cellOffset).add(centerOffset),
                                type: a.type
                            });
                        });
                    });
                });
            });

            const bondPoints = [];
            let maxDist = 0.6;
            if (currentStructure.id === 'bcc') maxDist = 0.88;
            if (currentStructure.id === 'cscl') maxDist = 0.88;
            if (currentStructure.id === 'zns') maxDist = 0.5;
            if (currentStructure.id === 'diamond') maxDist = 0.44;

            for (let i = 0; i < allPos.length; i++) {
                for (let j = i + 1; j < allPos.length; j++) {
                    const d = allPos[i].pos.distanceTo(allPos[j].pos);
                    if (d > 0.1 && d <= maxDist) {
                        if (currentCategory === 'ionic' && currentStructure.id !== 'diamond' && allPos[i].type === allPos[j].type) continue;
                        
                        bondPoints.push(allPos[i].pos);
                        bondPoints.push(allPos[j].pos);
                    }
                }
            }

            if (bondPoints.length > 0) {
                const geo = new THREE.BufferGeometry().setFromPoints(bondPoints);
                const mat = new THREE.LineBasicMaterial({
                    color: COLORS.bond,
                    opacity: 0.4,
                    transparent: true,
                    clippingPlanes: clippingPlanes
                });
                const bonds = new THREE.LineSegments(geo, mat);
                bondsGroup.add(bonds);
            }
        }

        function selectCategory(category) {
            currentCategory = category;

            const btnMetal = document.getElementById('btn-cat-metal');
            const btnIonic = document.getElementById('btn-cat-ionic');

            if (category === 'metal') {
                btnMetal.className = "py-2 px-3 rounded-lg text-sm font-medium transition-all bg-blue-600 text-white shadow-lg shadow-blue-600/30";
                btnIonic.className = "py-2 px-3 rounded-lg text-sm font-medium transition-all bg-slate-700 text-slate-300 hover:bg-slate-600";
            } else {
                btnIonic.className = "py-2 px-3 rounded-lg text-sm font-medium transition-all bg-blue-600 text-white shadow-lg shadow-blue-600/30";
                btnMetal.className = "py-2 px-3 rounded-lg text-sm font-medium transition-all bg-slate-700 text-slate-300 hover:bg-slate-600";
            }

            const btnContainer = document.getElementById('structure-buttons');
            btnContainer.innerHTML = '';
            DATA[category].forEach(item => {
                const btn = document.createElement('button');
                btn.id = `btn-struct-${item.id}`;
                btn.onclick = () => changeStructure(item.id);
                btn.innerText = item.name;
                btnContainer.appendChild(btn);
            });

            changeStructure(DATA[category][0].id);
        }

        function changeStructure(id) {
            currentStructure = DATA[currentCategory].find(s => s.id === id);

            DATA[currentCategory].forEach(item => {
                const btn = document.getElementById(`btn-struct-${item.id}`);
                if (btn) {
                    if (item.id === id) {
                        btn.className = "w-full text-left text-xs py-2 px-3 rounded-lg font-semibold transition-all bg-cyan-600 text-white shadow-md shadow-cyan-600/30 border border-cyan-400/30";
                    } else {
                        btn.className = "w-full text-left text-xs py-2 px-3 rounded-lg font-medium transition-all bg-slate-900/60 text-slate-300 border border-slate-700/60 hover:bg-slate-700";
                    }
                }
            });

            changeSlicePlane('none');

            const infoContent = document.getElementById('info-content');
            infoContent.innerHTML = `
                <p>${currentStructure.desc}</p>
                <div class="grid grid-cols-2 gap-2 pt-2 text-[11px] border-t border-slate-800">
                    <div><span class="text-slate-400">配位数:</span> <span class="font-semibold text-slate-200">${currentStructure.coordination}</span></div>
                    <div><span class="text-slate-400">充填率:</span> <span class="font-semibold text-slate-200">${currentStructure.packingRatio}</span></div>
                    <div class="col-span-2"><span class="text-slate-400">単位格子中の原子数:</span> <span class="font-semibold text-slate-200">${currentStructure.atomsInCell}</span></div>
                    <div class="col-span-2"><span class="text-slate-400">代表例:</span> <span class="font-semibold text-slate-200">${currentStructure.examples}</span></div>
                </div>
            `;

            buildCrystal();
        }

        function updateAtomRadius(val) {
            currentRadiusScale = parseFloat(val);
            document.getElementById('radius-val').innerText = `${Math.round(val * 100)}%`;
            buildCrystal();
        }

        function toggleCropCell(checked) {
            cropToUnitCell = checked;
            buildCrystal();
        }

        function toggleUnitCell(checked) {
            showUnitCell = checked;
            unitCellGroup.visible = checked;
        }

        function toggleBonds(checked) {
            showBonds = checked;
            bondsGroup.visible = checked;
        }

        function toggleSupercell(checked) {
            showSupercell = checked;
            buildCrystal();
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        window.onload = init;
    </script>
</body>
