<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>周期表＆物性値ヒートマップ（スマホ横向き用）</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Noto Sans JP -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
        }

        /* 周期表のグリッド設定（スマホ横向き1画面に収まる比率） */
        .ptable-grid-18 {
            display: grid;
            grid-template-columns: repeat(18, minmax(0, 1fr));
            gap: 2px;
        }

        .ptable-grid-8 {
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            gap: 3px;
        }

        /* 元素セルのスタイル（横向き画面の高さに収まるコンパクト設計） */
        .element-cell {
            height: 36px;
            transition: transform 0.12s ease, background-color 0.25s ease;
            user-select: none;
            overflow: hidden;
        }

        @media (min-height: 450px) {
            .element-cell {
                height: 42px;
            }
        }

        .element-cell:active {
            transform: scale(1.15);
            z-index: 30;
        }

        /* ヒートマップカラーバー */
        .heatmap-bar {
            background: linear-gradient(90deg, #3b82f6 0%, #06b6d4 25%, #10b981 50%, #eab308 75%, #ef4444 100%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ファーストビュー：横向き1画面に収まるメインエリア（指標選択 ＋ 周期表 ＋ 簡易凡例） -->
    <div class="w-full max-w-6xl mx-auto px-2 py-1.5 flex flex-col gap-1.5">

        <!-- 上部コントロールバー：指標8ボタン ＋ 遷移元素切替スイッチを横並び配置 -->
        <section class="bg-white px-2 py-1.5 rounded-xl shadow-xs border border-slate-200 flex items-stretch gap-1.5">
            <!-- 指標選択ボタン群（4列×2行の超コンパクトグリッド） -->
            <div id="metric-buttons" class="flex-grow grid grid-cols-4 gap-1">
                <!-- JavaScriptで動的に生成 -->
            </div>

            <!-- 右端：18族 / 典型元素 切替ボタン（縦2段積み） -->
            <div class="shrink-0 flex flex-col justify-between bg-slate-100 p-0.5 rounded-lg border border-slate-200 w-[86px]">
                <button id="btn-include-trans" class="w-full py-1 px-1.5 rounded-md text-[10px] font-bold leading-tight transition-all bg-white text-indigo-600 shadow-2xs text-center">
                    18族 (全元素)
                </button>
                <button id="btn-exclude-trans" class="w-full py-1 px-1.5 rounded-md text-[10px] font-bold leading-tight transition-all text-slate-600 hover:text-slate-900 text-center">
                    典型のみ (8族)
                </button>
            </div>
        </section>

        <!-- 中央メイン：周期表（横スクロール不要で画面幅にフィット） -->
        <section class="bg-white px-1.5 py-1.5 rounded-xl shadow-xs border border-slate-200">
            <div id="periodic-table" class="w-full">
                <!-- JavaScriptで周期表セルを生成 -->
            </div>
        </section>

        <!-- 下部コンパクトステータスバー：選択中の指標概要 / ヒートマップ凡例 / 元素分類色 -->
        <section id="compact-status-bar" class="bg-white px-2.5 py-1 rounded-xl shadow-xs border border-slate-200 flex items-center justify-between gap-2 text-[10px] leading-tight">
            <!-- 標準モード時の分類凡例 -->
            <div id="category-legend-inline" class="flex flex-wrap items-center gap-x-2.5 gap-y-0.5">
                <span class="font-bold text-slate-500">分類:</span>
                <span class="font-bold text-red-600">■アルカリ</span>
                <span class="font-bold text-orange-600">■アルカリ土類</span>
                <span class="font-bold text-amber-600">■遷移</span>
                <span class="font-bold text-emerald-700">■他金属</span>
                <span class="font-bold text-teal-600">■半金属</span>
                <span class="font-bold text-blue-600">■非金属</span>
                <span class="font-bold text-purple-600">■ハロゲン</span>
                <span class="font-bold text-pink-600">■貴ガス</span>
            </div>

            <!-- 指標選択時のヒートマップバー＆現在値レンジ -->
            <div id="heatmap-legend-inline" class="hidden flex-grow flex items-center justify-between gap-3">
                <div class="flex items-center gap-1.5 truncate">
                    <span id="inline-metric-name" class="font-bold text-indigo-700 text-xs shrink-0">指標名</span>
                    <span id="inline-metric-hint" class="text-slate-500 truncate hidden sm:inline">セルをタップで詳細・下に解説とグラフ</span>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                    <span id="legend-min" class="font-mono font-bold text-slate-600">最小</span>
                    <div class="w-24 sm:w-32 h-2.5 rounded-full heatmap-bar border border-slate-300/60"></div>
                    <span id="legend-max" class="font-mono font-bold text-slate-600">最大</span>
                    <span id="legend-unit" class="font-mono text-indigo-600 font-bold ml-0.5">単位</span>
                </div>
            </div>

            <span class="text-[9px] text-slate-400 shrink-0 hidden md:inline">※セルをタップで全データ表示</span>
        </section>

    </div>

    <!-- スクロール領域：指標の詳しい解説＆1〜36番推移グラフ -->
    <div class="w-full max-w-6xl mx-auto px-2 pb-4 flex flex-col gap-2">

        <!-- 指標の定義・解説エリア -->
        <section id="definition-box" class="bg-indigo-50/80 border border-indigo-100 rounded-xl p-2.5 transition-all">
            <div class="flex items-center gap-2 mb-0.5">
                <span id="def-badge" class="px-1.5 py-0.5 text-[10px] font-bold bg-slate-600 text-white rounded">標準モード</span>
                <h3 id="def-title" class="font-bold text-slate-800 text-xs sm:text-sm">元素の分類（文字色による区分）</h3>
            </div>
            <p id="def-text" class="text-xs text-slate-600 leading-relaxed">
                元素記号の文字色で元素の分類を表しています。上部の指標ボタンをタップすると数値データとヒートマップに切り替わり、再度タップすると標準表示に戻ります。
            </p>
        </section>

        <!-- 原子番号 1〜36 (H〜Kr) の指標推移グラフ -->
        <section id="chart-section" class="bg-white p-2.5 rounded-xl shadow-xs border border-slate-200 hidden">
            <div class="flex items-center justify-between gap-2 mb-1.5">
                <h3 id="chart-title" class="font-bold text-slate-800 text-xs sm:text-sm">指標の周期的変化（原子番号 1〜36：H 〜 Kr）</h3>
                <span id="chart-unit-badge" class="px-2 py-0.5 text-[10px] font-mono font-semibold bg-slate-100 text-slate-600 rounded border border-slate-200">単位: pm</span>
            </div>
            <div id="chart-container" class="relative w-full overflow-x-auto">
                <div id="chart-wrapper" class="min-w-[600px] w-full relative">
                    <svg id="trend-chart" class="w-full h-48 block select-none"></svg>
                    <div id="chart-tooltip" class="pointer-events-none hidden absolute z-20 bg-slate-900/95 text-white text-[11px] rounded-md px-2 py-1 shadow-lg whitespace-nowrap"></div>
                </div>
            </div>
        </section>

    </div>

    <!-- 元素詳細モーダル（セルタップ時に表示） -->
    <div id="element-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center z-50 p-3">
        <div class="bg-white rounded-2xl max-w-md w-full p-4 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-2.5">
                <div class="flex items-center gap-2.5">
                    <div class="w-12 h-12 rounded-xl bg-slate-100 flex flex-col items-center justify-center border border-slate-200">
                        <span id="modal-number" class="text-[10px] font-bold text-slate-500">1</span>
                        <span id="modal-symbol" class="text-xl font-extrabold">H</span>
                    </div>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <span id="modal-category" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">非金属</span>

                        </div>
                        <h3 id="modal-name" class="text-base font-bold text-slate-800 mt-0.5">水素</h3>
                    </div>
                </div>
                <button id="close-modal" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg bg-slate-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="modal-metrics-list" class="grid grid-cols-2 gap-1.5 border-t border-slate-100 pt-2.5 text-xs">
                <!-- 全指標の数値リスト（横向きでも見やすい2列グリッド） -->
            </div>
        </div>
    </div>

        const CATEGORIES = {

        const state = {

        /**
         * セル内表示用の数値フォーマット（コンパクト幅に合わせて桁調整）
         */
        function formatValue(val, metricKey, isCompactCell = false) {
            if (val === null || val === undefined) return '—';
            const metric = METRICS[metricKey];
            if (!metric) return String(val);
            if (metricKey === 'density') {
                if (Math.abs(val) < 0.01) {
                    return isCompactCell ? Number(val).toFixed(3) : Number(val).toFixed(4);
                }
                return isCompactCell && val >= 10 ? Number(val).toFixed(1) : Number(val).toFixed(2);
            }
            return Number(val).toFixed(metric.decimals);
        }

        /**
         * ヒートマップ背景色（青→水色→緑→黄→赤）
         */
        function getHeatmapStyle(val, min, max) {
            if (val === null || val === undefined) {
                return { bg: '#f1f5f9' };
            }
            const ratio = max === min ? 0.5 : Math.max(0, Math.min(1, (val - min) / (max - min)));
            const hue = (1 - ratio) * 220;
            return {
                bg: `hsl(${hue.toFixed(0)}, 85%, 65%)`
            };
        }

        /**
         * 指標選択ボタンの描画（4列×2行のコンパクトボタン）
         */
        function renderMetricButtons() {
            const container = document.getElementById('metric-buttons');
            container.innerHTML = '';

            Object.values(METRICS).forEach(m => {
                const isSelected = state.selectedMetric === m.id;
                const btn = document.createElement('button');
                btn.className = `flex items-center justify-between gap-1 px-2 py-1 rounded-lg border text-left transition-all ${
                    isSelected
                        ? 'bg-indigo-600 border-indigo-600 text-white shadow-2xs ring-1 ring-indigo-300'
                        : 'bg-slate-50 border-slate-200 text-slate-700 active:bg-indigo-50'
                }`;
                btn.innerHTML = `
                    <span class="font-bold text-[11px] sm:text-xs truncate">${m.shortName}</span>
                    <span class="text-[9px] font-mono shrink-0 ${isSelected ? 'text-indigo-200' : 'text-slate-400'}">${m.unit}</span>
                `;
                btn.addEventListener('click', () => {
                    state.selectedMetric = (state.selectedMetric === m.id) ? null : m.id;
                    updateUI();
                });
                container.appendChild(btn);
            });
        }

        /**
         * ステータスバーと定義エリアの更新
         */
        function updateDefinitionArea() {
            const badge = document.getElementById('def-badge');
            const title = document.getElementById('def-title');
            const text = document.getElementById('def-text');

            const catInline = document.getElementById('category-legend-inline');
            const hmInline = document.getElementById('heatmap-legend-inline');

            if (!state.selectedMetric) {
                badge.textContent = '標準モード';
                badge.className = 'px-1.5 py-0.5 text-[10px] font-bold bg-slate-600 text-white rounded';
                title.textContent = '元素の分類（文字色による区分）';
                text.textContent = '元素記号の文字色で元素の分類を表しています。上部の指標ボタンをタップすると数値データとヒートマップに切り替わり、再度タップすると標準表示に戻ります。';

                catInline.classList.remove('hidden');
                hmInline.classList.add('hidden');
            } else {
                const m = METRICS[state.selectedMetric];
                badge.textContent = `単位: ${m.unit}`;
                badge.className = 'px-1.5 py-0.5 text-[10px] font-bold bg-indigo-600 text-white rounded';
                title.textContent = m.name;
                text.textContent = m.definition;

                const visibleElements = getVisibleElements();
                const values = visibleElements
                    .map(el => el.vals[state.selectedMetric])
                    .filter(v => v !== null && v !== undefined);
                const min = Math.min(...values);
                const max = Math.max(...values);

                document.getElementById('inline-metric-name').textContent = m.name;
                document.getElementById('legend-min').textContent = formatValue(min, state.selectedMetric);
                document.getElementById('legend-max').textContent = formatValue(max, state.selectedMetric);
                document.getElementById('legend-unit').textContent = m.unit;

                catInline.classList.add('hidden');
                hmInline.classList.remove('hidden');
            }
        }

        function getVisibleElements() {
            if (state.includeTransition) {
                return ELEMENTS;
            } else {
                return ELEMENTS.filter(el => el.g <= 2 || el.g >= 13);
            }
        }

        /**
         * 周期表の描画（横幅100%に収まるコンパクトグリッド）
         */
        function renderPeriodicTable() {
            const container = document.getElementById('periodic-table');
            container.innerHTML = '';

            const visibleElements = getVisibleElements();

            let minVal = 0, maxVal = 1;
            if (state.selectedMetric) {
                const vals = visibleElements
                    .map(el => el.vals[state.selectedMetric])
                    .filter(v => v !== null && v !== undefined);
                minVal = Math.min(...vals);
                maxVal = Math.max(...vals);
            }

            if (state.includeTransition) {
                container.className = 'ptable-grid-18 w-full';

                // 族番号ヘッダー（1〜18）
                for (let g = 1; g <= 18; g++) {
                    const headerCell = document.createElement('div');
                    headerCell.className = 'text-center text-[9px] font-bold text-slate-400 leading-none pb-0.5';
                    headerCell.textContent = g;
                    container.appendChild(headerCell);
                }

                for (let p = 1; p <= 7; p++) {
                    for (let g = 1; g <= 18; g++) {
                        if ((p === 6 || p === 7) && g === 3) {
                            const placeholder = document.createElement('div');
                            placeholder.className = 'element-cell rounded border border-dashed border-slate-300 bg-slate-50 flex items-center justify-center text-[7px] text-slate-400 leading-none text-center';
                            placeholder.innerHTML = p === 6 ? '57-71' : '89-103';
                            container.appendChild(placeholder);
                            continue;
                        }

                        const el = visibleElements.find(e => e.p === p && e.g === g);
                        if (el) {
                            container.appendChild(createElementCell(el, minVal, maxVal, false));
                        } else {
                            container.appendChild(document.createElement('div'));
                        }
                    }
                }
            } else {
                // 典型元素のみ（8族短周期レイアウト）
                container.className = 'ptable-grid-8 max-w-2xl mx-auto';
                const mainGroups = [1, 2, 13, 14, 15, 16, 17, 18];

                mainGroups.forEach(g => {
                    const headerCell = document.createElement('div');
                    headerCell.className = 'text-center text-[10px] font-bold text-slate-500 leading-none pb-0.5';
                    headerCell.textContent = `${g}族`;
                    container.appendChild(headerCell);
                });

                for (let p = 1; p <= 7; p++) {
                    for (let col = 0; col < mainGroups.length; col++) {
                        const g = mainGroups[col];
                        const el = visibleElements.find(e => e.p === p && e.g === g);
                        if (el) {
                            container.appendChild(createElementCell(el, minVal, maxVal, true));
                        } else {
                            container.appendChild(document.createElement('div'));
                        }
                    }
                }
            }
        }

        /**
         * 個別の元素セルDOM生成（18族時は高密度・8族時は元素名も表示）
         */
        function createElementCell(el, minVal, maxVal, isWideMode) {
            const cell = document.createElement('div');
            const catInfo = CATEGORIES[el.cat];
            const metricKey = state.selectedMetric;
            const val = metricKey ? el.vals[metricKey] : null;

            let bgStyle = 'background-color: #ffffff;';
            let borderClass = 'border-slate-200';
            let symbolOutlineStyle = '';

            if (metricKey) {
                const hm = getHeatmapStyle(val, minVal, maxVal);
                bgStyle = `background-color: ${hm.bg};`;
                borderClass = val !== null ? 'border-slate-400/50' : 'border-slate-200';
                symbolOutlineStyle = 'text-shadow: -0.8px -0.8px 0 #fff, 0.8px -0.8px 0 #fff, -0.8px 0.8px 0 #fff, 0.8px 0.8px 0 #fff, 0px 0px 3px rgba(255,255,255,0.95);';
            }

            cell.className = `element-cell rounded border ${borderClass} px-0.5 py-0.5 flex flex-col justify-between cursor-pointer relative`;
            cell.style = bgStyle;

            // 上段：原子番号
            const topRow = `
                <div class="flex justify-start items-center text-[7px] sm:text-[8px] leading-none font-semibold text-slate-600">
                    <span>${el.z}</span>
                </div>
            `;

            // 中段：元素記号
            const charge = (metricKey === 'ionicRadius' && ION_CHARGES[el.sym]) ? ION_CHARGES[el.sym] : '';
            const symbolDisplay = charge
                ? `${el.sym}<sup class="text-[7px] font-bold leading-none">${charge}</sup>`
                : el.sym;

            const midRow = `
                <div class="flex-grow flex items-center justify-center font-extrabold ${isWideMode ? 'text-xs sm:text-sm' : 'text-[11px] sm:text-xs'} leading-none whitespace-nowrap ${catInfo.textClass}" style="${symbolOutlineStyle}">
                    ${symbolDisplay}
                </div>
            `;

            // 下段：指標選択時は数値、標準時は8族モードなら元素名・18族モードならスッキリ表示
            let bottomRow = '';
            if (metricKey) {
                const formatted = formatValue(val, metricKey, !isWideMode);
                bottomRow = `
                    <div class="w-full text-center text-[7.5px] sm:text-[8.5px] font-bold text-slate-900 bg-white/80 rounded-[2px] px-px truncate leading-tight tracking-tighter">
                        ${formatted}
                    </div>
                `;
            } else if (isWideMode) {
                bottomRow = `
                    <div class="w-full text-center text-[8px] text-slate-500 truncate leading-none">
                        ${el.name}
                    </div>
                `;
            } else {
                bottomRow = `<div class="h-1"></div>`;
            }

            cell.innerHTML = topRow + midRow + bottomRow;
            cell.addEventListener('click', () => openElementModal(el));

            return cell;
        }

        /**
         * 元素詳細モーダル表示
         */
        function openElementModal(el) {
            const modal = document.getElementById('element-modal');
            const catInfo = CATEGORIES[el.cat];

            document.getElementById('modal-number').textContent = `No.${el.z}`;
            const symEl = document.getElementById('modal-symbol');
            symEl.textContent = el.sym;
            symEl.className = `text-xl font-extrabold ${catInfo.textClass}`;

            document.getElementById('modal-category').textContent = catInfo.label;
            document.getElementById('modal-name').textContent = el.name;
            document.getElementById('modal-group-period').textContent = `第${el.p}周期 / ${el.g}族`;

            const list = document.getElementById('modal-metrics-list');
            list.innerHTML = '';

            const modalOrder = [
                'atomicRadius', 'ionicRadius',
                'ionizationEnergy', 'electronAffinity',
                'electronegativity', 'density',
                'meltingPoint', 'boilingPoint'
            ];

            modalOrder.forEach(key => {
                const m = METRICS[key];
                const val = el.vals[m.id];
                const formatted = formatValue(val, m.id, false);
                const isCurrent = state.selectedMetric === m.id;

                const row = document.createElement('div');
                row.className = `flex justify-between items-center py-1 px-2 rounded-lg border ${isCurrent ? 'bg-indigo-50 border-indigo-200 font-bold text-indigo-900' : 'bg-slate-50/70 border-slate-100'}`;
                row.innerHTML = `
                    <span class="text-[11px] text-slate-600 truncate mr-1">${m.shortName}</span>
                    <span class="font-mono font-semibold text-xs shrink-0">${formatted} <span class="text-[9px] text-slate-400 font-normal">${val !== null ? m.unit : ''}</span></span>
                `;
                list.appendChild(row);
            });

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        /**
         * 原子番号1〜36までの折れ線グラフ描画
         */
        function renderTrendChart() {
            const section = document.getElementById('chart-section');
            const svg = document.getElementById('trend-chart');
            const tooltip = document.getElementById('chart-tooltip');

            if (!state.selectedMetric) {
                section.classList.add('hidden');
                return;
            }

            section.classList.remove('hidden');
            const metric = METRICS[state.selectedMetric];

            document.getElementById('chart-title').textContent = `${metric.name}の推移（原子番号 1〜36：H 〜 Kr）`;
            document.getElementById('chart-unit-badge').textContent = `単位: ${metric.unit}`;

            const targetElements = getVisibleElements().filter(el => el.z <= 36);
            const validPoints = targetElements
                .map(el => ({ el, val: el.vals[state.selectedMetric] }))
                .filter(d => d.val !== null && d.val !== undefined);

            const width = 880;
            const height = 210;
            const padLeft = 52;
            const padRight = 18;
            const padTop = 16;
            const padBottom = 38;
            const plotW = width - padLeft - padRight;
            const plotH = height - padTop - padBottom;

            svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
            svg.innerHTML = '';

            if (validPoints.length === 0) return;

            const rawMin = Math.min(...validPoints.map(d => d.val));
            const rawMax = Math.max(...validPoints.map(d => d.val));
            const yMin = rawMin > 0 ? 0 : rawMin * 1.1;
            const yMax = rawMax === yMin ? rawMax + 1 : rawMax * 1.08;

            const getX = (z) => padLeft + ((z - 1) / 35) * plotW;
            const getY = (val) => padTop + plotH - ((val - yMin) / (yMax - yMin)) * plotH;

            const createSvgEl = (tag, attrs) => {
                const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
                Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
                return el;
            };

            const periodRanges = [
                { label: '第1周期', start: 1, end: 2, fill: '#f8fafc' },
                { label: '第2周期', start: 3, end: 10, fill: '#ffffff' },
                { label: '第3周期', start: 11, end: 18, fill: '#f8fafc' },
                { label: '第4周期', start: 19, end: 36, fill: '#ffffff' }
            ];

            periodRanges.forEach(pr => {
                const x1 = pr.start === 1 ? padLeft : (getX(pr.start - 1) + getX(pr.start)) / 2;
                const x2 = pr.end === 36 ? padLeft + plotW : (getX(pr.end) + getX(pr.end + 1)) / 2;
                svg.appendChild(createSvgEl('rect', {
                    x: x1, y: padTop, width: x2 - x1, height: plotH, fill: pr.fill
                }));
                const pLabel = createSvgEl('text', {
                    x: (x1 + x2) / 2, y: padTop + 11,
                    'text-anchor': 'middle', fill: '#94a3b8', 'font-size': '9', 'font-weight': '600'
                });
                pLabel.textContent = pr.label;
                svg.appendChild(pLabel);
            });

            const ticks = 4;
            for (let i = 0; i <= ticks; i++) {
                const ratio = i / ticks;
                const val = yMin + (yMax - yMin) * ratio;
                const y = getY(val);

                svg.appendChild(createSvgEl('line', {
                    x1: padLeft, y1: y, x2: padLeft + plotW, y2: y,
                    stroke: i === 0 ? '#94a3b8' : '#e2e8f0',
                    'stroke-width': i === 0 ? '1.2' : '1',
                    'stroke-dasharray': i === 0 ? '' : '3,3'
                }));

                const label = createSvgEl('text', {
                    x: padLeft - 6, y: y + 3,
                    'text-anchor': 'end', fill: '#64748b', 'font-size': '9', 'font-family': 'monospace'
                });
                label.textContent = formatValue(val, state.selectedMetric, false);
                svg.appendChild(label);
            }

            if (yMin < 0 && yMax > 0) {
                const zeroY = getY(0);
                svg.appendChild(createSvgEl('line', {
                    x1: padLeft, y1: zeroY, x2: padLeft + plotW, y2: zeroY,
                    stroke: '#64748b', 'stroke-width': '1'
                }));
            }

            for (let z = 1; z <= 36; z++) {
                const el = ELEMENTS.find(e => e.z === z);
                if (!el) continue;
                const isVisible = targetElements.some(e => e.z === z);
                const x = getX(z);

                const symText = createSvgEl('text', {
                    x: x, y: padTop + plotH + 13,
                    'text-anchor': 'middle',
                    fill: isVisible ? '#334155' : '#cbd5e1',
                    'font-size': '9.5',
                    'font-weight': isVisible ? '700' : '400'
                });
                symText.textContent = el.sym;
                svg.appendChild(symText);

                const zText = createSvgEl('text', {
                    x: x, y: padTop + plotH + 24,
                    'text-anchor': 'middle',
                    fill: isVisible ? '#64748b' : '#cbd5e1',
                    'font-size': '8',
                    'font-family': 'monospace'
                });
                zText.textContent = z;
                svg.appendChild(zText);
            }

            let pathD = '';
            let prevConnected = false;
            targetElements.forEach(el => {
                const val = el.vals[state.selectedMetric];
                if (val === null || val === undefined) {
                    prevConnected = false;
                    return;
                }
                const x = getX(el.z);
                const y = getY(val);
                pathD += `${prevConnected ? 'L' : 'M'} ${x.toFixed(1)} ${y.toFixed(1)} `;
                prevConnected = true;
            });

            if (pathD) {
                svg.appendChild(createSvgEl('path', {
                    d: pathD.trim(),
                    fill: 'none',
                    stroke: '#6366f1',
                    'stroke-width': '2',
                    'stroke-linejoin': 'round'
                }));
            }

            validPoints.forEach(({ el, val }) => {
                const x = getX(el.z);
                const y = getY(val);
                const hm = getHeatmapStyle(val, rawMin, rawMax);

                const circle = createSvgEl('circle', {
                    cx: x, cy: y, r: '4',
                    fill: hm.bg,
                    stroke: '#1e293b',
                    'stroke-width': '1.1'
                });

                const hitArea = createSvgEl('circle', {
                    cx: x, cy: y, r: '11',
                    fill: 'transparent',
                    class: 'cursor-pointer'
                });

                const showTooltip = () => {
                    circle.setAttribute('r', '6.5');
                    const formatted = formatValue(val, state.selectedMetric, false);
                    const charge = (state.selectedMetric === 'ionicRadius' && ION_CHARGES[el.sym]) ? ION_CHARGES[el.sym] : '';
                    tooltip.innerHTML = `<span class="font-bold text-indigo-300">${el.z}. ${el.sym}${charge} (${el.name})</span> : <span class="font-mono font-bold">${formatted} ${metric.unit}</span>`;
                    tooltip.classList.remove('hidden');

                    const pctX = (x / width) * 100;
                    const pctY = (y / height) * 100;
                    tooltip.style.left = `calc(${pctX}% - ${pctX > 75 ? '120px' : pctX < 20 ? '10px' : '60px'})`;
                    tooltip.style.top = `calc(${pctY}% - 34px)`;
                };

                const hideTooltip = () => {
                    circle.setAttribute('r', '4');
                    tooltip.classList.add('hidden');
                };

                hitArea.addEventListener('mouseenter', showTooltip);
                hitArea.addEventListener('mouseleave', hideTooltip);
                hitArea.addEventListener('click', () => {
                    showTooltip();
                    openElementModal(el);
                });

                svg.appendChild(circle);
                svg.appendChild(hitArea);
            });
        }

        function updateUI() {
            renderMetricButtons();
            updateDefinitionArea();
            renderPeriodicTable();
            renderTrendChart();

            const btnInc = document.getElementById('btn-include-trans');
            const btnExc = document.getElementById('btn-exclude-trans');
            if (state.includeTransition) {
                btnInc.className = 'w-full py-1 px-1.5 rounded-md text-[10px] font-bold leading-tight transition-all bg-white text-indigo-600 shadow-2xs text-center';
                btnExc.className = 'w-full py-1 px-1.5 rounded-md text-[10px] font-bold leading-tight transition-all text-slate-600 hover:text-slate-900 text-center';
            } else {
                btnExc.className = 'w-full py-1 px-1.5 rounded-md text-[10px] font-bold leading-tight transition-all bg-white text-indigo-600 shadow-2xs text-center';
                btnInc.className = 'w-full py-1 px-1.5 rounded-md text-[10px] font-bold leading-tight transition-all text-slate-600 hover:text-slate-900 text-center';
            }
        }

        document.getElementById('btn-include-trans').addEventListener('click', () => {
            state.includeTransition = true;
            updateUI();
        });

        document.getElementById('btn-exclude-trans').addEventListener('click', () => {
            state.includeTransition = false;
            updateUI();
        });

        document.getElementById('close-modal').addEventListener('click', () => {
            const modal = document.getElementById('element-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        });

        document.getElementById('element-modal').addEventListener('click', (e) => {
            if (e.target.id === 'element-modal') {
                e.target.classList.add('hidden');
                e.target.classList.remove('flex');
            }
        });

        updateUI();
    </script>
</body>
