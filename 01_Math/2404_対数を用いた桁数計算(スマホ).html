<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3^n 対数・桁数計算ツール</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 28px;
            width: 28px;
            border-radius: 50%;
            background: #6366f1;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.4);
            border: 3px solid #ffffff;
            transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.15);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4 sm:p-6">

    <div class="max-w-md w-full space-y-4">
        
        <!-- Header -->
        <header class="text-center">
            <h1 class="text-xl font-extrabold tracking-tight text-white">3<sup class="text-indigo-400">n</sup> の桁数</h1>
        </header>

        <!-- Slider Card -->
        <div class="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-4 shadow-xl backdrop-blur">
            <div class="flex items-center justify-between border-b border-slate-700/60 pb-2 mb-3">
                <span class="text-slate-400 font-medium text-xs">指数 n</span>
            </div>

            <!-- Slider -->
            <div class="flex items-center gap-2">
                <button id="btn-minus" class="w-9 h-9 rounded-xl bg-slate-700 hover:bg-slate-600 active:bg-indigo-600 text-white flex items-center justify-center font-bold text-sm transition-colors shadow">
                    <i class="fa-solid fa-minus"></i>
                </button>
                <div class="relative flex-1">
                    <input type="range" id="n-slider" min="0" max="50" value="10" 
                           class="w-full h-2.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500 focus:outline-none">
                </div>
                <button id="btn-plus" class="w-9 h-9 rounded-xl bg-slate-700 hover:bg-slate-600 active:bg-indigo-600 text-white flex items-center justify-center font-bold text-sm transition-colors shadow">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <!-- Quick Presets -->
            <div class="flex justify-between items-center gap-1 pt-3">
                <button class="preset-btn px-2 py-1 text-[11px] font-medium bg-slate-700/60 hover:bg-indigo-600 text-slate-300 hover:text-white rounded-lg transition" data-val="0">n=0</button>
                <button class="preset-btn px-2 py-1 text-[11px] font-medium bg-slate-700/60 hover:bg-indigo-600 text-slate-300 hover:text-white rounded-lg transition" data-val="10">n=10</button>
                <button class="preset-btn px-2 py-1 text-[11px] font-medium bg-slate-700/60 hover:bg-indigo-600 text-slate-300 hover:text-white rounded-lg transition" data-val="20">n=20</button>
                <button class="preset-btn px-2 py-1 text-[11px] font-medium bg-slate-700/60 hover:bg-indigo-600 text-slate-300 hover:text-white rounded-lg transition" data-val="30">n=30</button>
                <button class="preset-btn px-2 py-1 text-[11px] font-medium bg-slate-700/60 hover:bg-indigo-600 text-slate-300 hover:text-white rounded-lg transition" data-val="40">n=40</button>
                <button class="preset-btn px-2 py-1 text-[11px] font-medium bg-slate-700/60 hover:bg-indigo-600 text-slate-300 hover:text-white rounded-lg transition" data-val="50">n=50</button>
            </div>

            <!-- Real Exact Value Display (Label removed) -->
            <div class="mt-3 pt-3 border-t border-slate-700/60 text-center">
                <div id="slider-exact-display" class="text-xs sm:text-sm font-bold font-mono text-emerald-300 bg-slate-900/80 border border-slate-700/80 rounded-xl p-2.5 break-all leading-relaxed shadow-inner select-all">
                    3¹⁰ = 59,049
                </div>
            </div>
        </div>

        <!-- Inequality Card 1: 10^k <= 3^n < 10^(k+1) -->
        <div class="bg-gradient-to-br from-slate-800 to-slate-850 border border-indigo-500/30 rounded-2xl p-4 shadow-xl">
            <div class="text-[11px] font-bold text-indigo-300 uppercase tracking-wider mb-2 flex items-center justify-between">
                <span>① 10の累乗</span>
                <span id="digit-badge" class="bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full text-[10px] font-mono">5 桁</span>
            </div>

            <div class="flex items-center justify-between gap-1 py-1">
                <!-- Left: 10^k -->
                <div class="flex-1 min-h-[96px] flex flex-col justify-center items-center text-center bg-slate-900/80 border border-slate-700/60 rounded-xl p-2 overflow-hidden">
                    <div class="text-[10px] text-slate-400 mb-1 font-mono">10<sup id="exp-lower">4</sup></div>
                    <div id="val-lower" class="text-[10px] leading-tight font-bold font-mono text-cyan-300 w-full break-all">10000</div>
                </div>

                <!-- Less Than Sign -->
                <div class="text-indigo-400 font-extrabold text-lg px-0.5">≦</div>

                <!-- Center: Main Number (3^n Notation) -->
                <div class="flex-[1.4] min-h-[96px] flex flex-col justify-center items-center text-center bg-indigo-950/70 border border-indigo-500/50 rounded-xl p-2 shadow-inner overflow-hidden" id="main-num-box">
                    <div id="sci-value" class="text-lg sm:text-xl font-black font-mono text-amber-300 tracking-tight break-all">
                        3¹⁰
                    </div>
                </div>

                <!-- Less Than Sign -->
                <div class="text-indigo-400 font-extrabold text-lg px-0.5">&lt;</div>

                <!-- Right: 10^(k+1) -->
                <div class="flex-1 min-h-[96px] flex flex-col justify-center items-center text-center bg-slate-900/80 border border-slate-700/60 rounded-xl p-2 overflow-hidden">
                    <div class="text-[10px] text-slate-400 mb-1 font-mono">10<sup id="exp-upper">5</sup></div>
                    <div id="val-upper" class="text-[10px] leading-tight font-bold font-mono text-cyan-300 w-full break-all">100000</div>
                </div>
            </div>
        </div>

        <!-- Inequality Card 2: k <= log10(3^n) < k+1 -->
        <div class="bg-gradient-to-br from-slate-800 to-slate-850 border border-purple-500/30 rounded-2xl p-4 shadow-xl">
            <div class="text-[11px] font-bold text-purple-300 uppercase tracking-wider mb-2 flex items-center justify-between">
                <span>② 常用対数値</span>
                <span class="text-slate-400 text-[10px]">log₁₀(3ⁿ) = n × 0.4771</span>
            </div>

            <div class="flex items-center justify-between gap-1 py-1">
                <!-- Left: k -->
                <div class="flex-1 h-16 flex flex-col justify-center items-center text-center bg-slate-900/80 border border-slate-700/60 rounded-xl p-2">
                    <div class="text-[10px] text-slate-400 mb-0.5">整数部分</div>
                    <div id="log-lower" class="text-base font-black font-mono text-purple-300">4</div>
                </div>

                <!-- Less Than Sign -->
                <div class="text-purple-400 font-extrabold text-lg px-0.5">≦</div>

                <!-- Center: Log value -->
                <div class="flex-[1.5] h-16 flex flex-col justify-center items-center text-center bg-purple-950/60 border border-purple-500/50 rounded-xl p-2 shadow-inner">
                    <div class="text-[10px] text-purple-300 font-semibold mb-0.5">log₁₀(3<sup id="n-sup-2">10</sup>)</div>
                    <div id="log-val" class="text-base font-black font-mono text-amber-300">
                        4.7712
                    </div>
                </div>

                <!-- Less Than Sign -->
                <div class="text-purple-400 font-extrabold text-lg px-0.5">&lt;</div>

                <!-- Right: k + 1 -->
                <div class="flex-1 h-16 flex flex-col justify-center items-center text-center bg-slate-900/80 border border-slate-700/60 rounded-xl p-2">
                    <div class="text-[10px] text-slate-400 mb-0.5">+1 整数</div>
                    <div id="log-upper" class="text-base font-black font-mono text-purple-300">5</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Log10(3) constant
        const LOG10_3 = Math.log10(3); // ~ 0.47712125471966244

        // DOM Elements
        const slider = document.getElementById('n-slider');
        const nSup2 = document.getElementById('n-sup-2');
        const sliderExactDisplay = document.getElementById('slider-exact-display');
        
        const digitBadge = document.getElementById('digit-badge');
        
        // Exponent Inequality Elements
        const expLower = document.getElementById('exp-lower');
        const expUpper = document.getElementById('exp-upper');
        const valLower = document.getElementById('val-lower');
        const valUpper = document.getElementById('val-upper');
        const sciValue = document.getElementById('sci-value');

        // Log Inequality Elements
        const logLower = document.getElementById('log-lower');
        const logUpper = document.getElementById('log-upper');
        const logVal = document.getElementById('log-val');

        // Controls
        const btnMinus = document.getElementById('btn-minus');
        const btnPlus = document.getElementById('btn-plus');
        const presetBtns = document.querySelectorAll('.preset-btn');

        // Format power of 10 with repeated zeros (no scientific notation)
        function format10Power(exp) {
            if (exp < 0) return "1";
            return "1" + "0".repeat(exp);
        }

        // Main Calculation and UI Update Function
        function updateCalculations(n) {
            n = parseInt(n, 10);
            
            // 1. Update Slider & Power Labels
            slider.value = n;
            if (nSup2) nSup2.textContent = n;

            // 2. Exact Value (3^n)
            const valBig = 3n ** BigInt(n);
            const formattedExact = valBig.toLocaleString('en-US');
            
            // Display exact value below slider
            sliderExactDisplay.textContent = `3${toSuperscript(n)} = ${formattedExact}`;

            // 3. Logarithm & Digits
            const log10Val = n * LOG10_3;
            const log10Formatted = log10Val.toFixed(4);
            const k = Math.floor(log10Val); // Exponent k
            const kPlus1 = k + 1;

            const valStr = valBig.toString();
            const digits = valStr.length;
            digitBadge.textContent = `${digits} 桁`;

            // Display 3^n in Center Box
            const powerNotation = `3${toSuperscript(n)}`;
            sciValue.textContent = powerNotation;

            // Update Exponent Inequality (10^k <= 3^n < 10^(k+1))
            expLower.textContent = k;
            expUpper.textContent = kPlus1;
            valLower.textContent = format10Power(k);
            valUpper.textContent = format10Power(kPlus1);

            // Update Logarithm Inequality (k <= log10(3^n) < k+1)
            logLower.textContent = k;
            logUpper.textContent = kPlus1;
            logVal.textContent = log10Formatted;
        }

        // Helper for unicode superscripts in formula string
        function toSuperscript(num) {
            const supers = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
            return String(num).split('').map(c => supers[c] || c).join('');
        }

        // Event Listeners
        slider.addEventListener('input', (e) => updateCalculations(e.target.value));

        btnMinus.addEventListener('click', () => {
            let cur = parseInt(slider.value, 10);
            if (cur > 0) updateCalculations(cur - 1);
        });

        btnPlus.addEventListener('click', () => {
            let cur = parseInt(slider.value, 10);
            if (cur < 50) updateCalculations(cur + 1);
        });

        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                updateCalculations(btn.getAttribute('data-val'));
            });
        });

        // Initial load
        window.onload = () => updateCalculations(10);
    </script>
</body>
</html>
