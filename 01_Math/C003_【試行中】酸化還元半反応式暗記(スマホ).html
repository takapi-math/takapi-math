<!DOCTYPE html>
<html lang="ja" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>化学 半反応式暗記マスター - スマホ版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        ox: {
                            light: '#f0f7ff',
                            border: '#bfdbfe',
                            main: '#2563eb',
                            dark: '#1e40af',
                        },
                        red: {
                            light: '#fff1f2',
                            border: '#fecdd3',
                            main: '#e11d48',
                            dark: '#9f1239',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Touch safety & mobile optimizations */
        -webkit-tap-highlight-color: transparent;
        
        /* Subscript / Superscript formatting */
        .formula-text sub, .formula-text sup {
            font-size: 0.65em;
            line-height: 0;
            position: relative;
            vertical-align: baseline;
        }
        .formula-text sup { top: -0.45em; }
        .formula-text sub { bottom: -0.2em; }

        /* Smooth animation for step transitions */
        .highlight-part {
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block;
        }

        @keyframes popIn {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Hide scrollbars for clean mobile appearance */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Active touch response */
        .touch-active:active {
            transform: scale(0.97);
            opacity: 0.9;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 h-full flex flex-col font-sans overflow-hidden">

    <!-- App Header (Compact Mobile Header) -->
    <header class="bg-slate-900 text-white border-b border-slate-800 shrink-0 z-50 px-4 py-2.5 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-lg bg-cyan-500/20 flex items-center justify-center text-cyan-400">
                <i class="fa-solid fa-flask-vial text-lg"></i>
            </div>
            <div>
                <h1 class="text-sm font-extrabold tracking-tight leading-none text-slate-100">半反応式暗記マスター</h1>
                <span class="text-[10px] text-slate-400 font-medium">高校化学必修18選</span>
            </div>
        </div>
        
        <!-- View Switcher Tabs -->
        <div class="flex bg-slate-800 p-0.5 rounded-lg border border-slate-700 text-xs">
            <button id="tab-flashcard" onclick="switchView('flashcard')" class="px-2.5 py-1 rounded-md font-bold bg-cyan-600 text-white transition flex items-center gap-1">
                <i class="fa-solid fa-cards-blank text-[11px]"></i> 暗記
            </button>
            <button id="tab-list" onclick="switchView('list')" class="px-2.5 py-1 rounded-md font-medium text-slate-400 hover:text-white transition flex items-center gap-1">
                <i class="fa-solid fa-list-check text-[11px]"></i> 一覧
            </button>
        </div>
    </header>

    <!-- Main Application View Area -->
    <main class="flex-1 relative flex flex-col min-h-0 bg-slate-950">

        <!-- ================= FLASHCARD VIEW ================= -->
        <div id="view-flashcard" class="flex-1 flex flex-col p-3 max-w-md mx-auto w-full min-h-0 justify-between gap-2.5">
            
            <!-- Top Controls Toolbar -->
            <div class="bg-slate-800/90 border border-slate-700/80 rounded-xl p-1.5 flex justify-between items-center gap-1 shrink-0">
                <!-- Category Selector -->
                <div class="flex p-0.5 bg-slate-900 rounded-lg text-xs font-semibold">
                    <button onclick="setCategory('all')" id="btn-cat-all" class="px-2.5 py-1 rounded-md text-slate-100 bg-slate-700 transition">全種</button>
                    <button onclick="setCategory('ox')" id="btn-cat-ox" class="px-2.5 py-1 rounded-md text-slate-400 hover:text-blue-300 transition">酸化剤</button>
                    <button onclick="setCategory('red')" id="btn-cat-red" class="px-2.5 py-1 rounded-md text-slate-400 hover:text-rose-300 transition">還元剤</button>
                </div>
                
                <!-- Shuffle Toggle & Counter -->
                <div class="flex items-center gap-2 pr-1">
                    <button onclick="toggleRandomMode()" id="btn-random" class="px-2 py-1 rounded-lg text-xs border border-slate-700 bg-slate-800 text-slate-300 flex items-center gap-1 transition active:scale-95">
                        <i class="fa-solid fa-shuffle text-slate-500 text-[10px]" id="icon-random"></i> 
                        <span id="label-random">順送り</span>
                    </button>
                    <span class="text-xs font-bold text-cyan-400 font-mono" id="card-counter">1/18</span>
                </div>
            </div>

            <!-- Main Flashcard Container (Swipeable & Clickable) -->
            <div id="flashcard-box" 
                 class="flex-1 bg-slate-900 rounded-2xl border-2 border-slate-700 shadow-xl p-4 flex flex-col justify-between items-center relative overflow-hidden select-none touch-active cursor-pointer min-h-0" 
                 onclick="handleCardClick(event)">
                
                <!-- Card Header: Category Badge & Details -->
                <div class="w-full flex justify-between items-center z-10">
                    <div id="type-badge" class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold tracking-wide uppercase bg-blue-950 text-blue-300 border border-blue-800 flex items-center gap-1">
                        <i class="fa-solid fa-bolt text-[10px]"></i> 酸化剤
                    </div>
                    <div class="flex items-center gap-2">
                        <!-- Hint Button -->
                        <button onclick="event.stopPropagation(); toggleHint();" class="px-2 py-1 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 rounded-lg text-xs font-bold transition flex items-center gap-1 active:scale-95">
                            <i class="fa-solid fa-lightbulb text-amber-400"></i> ヒント
                        </button>
                        <div class="text-right">
                            <div id="item-title" class="text-base font-extrabold text-white leading-tight">過酸化水素</div>
                            <div id="item-note" class="text-[11px] font-medium text-slate-400">酸性条件</div>
                        </div>
                    </div>
                </div>

                <!-- Hint Display Box (Pre-reserved slot to prevent layout shift) -->
                <div id="hint-box" class="w-full h-8 flex items-center justify-center z-10 my-0.5 transition-all duration-200 opacity-0 invisible">
                    <span class="font-extrabold text-amber-400">💡 酸化数変化:</span> <span id="hint-text" class="font-bold font-mono text-amber-100"></span>
                </div>

                <!-- Card Body: Step Title & Formula -->
                <div class="my-auto text-center w-full flex flex-col justify-center items-center py-2 z-10">
                    <!-- Progress Step Tag -->
                    <div id="step-description" class="text-xs font-bold tracking-wider text-cyan-400 bg-cyan-950/80 px-3 py-1 rounded-full border border-cyan-800/50 mb-4 transition-all max-w-[90%] truncate">
                        Step 1: 反応前の物質
                    </div>

                    <!-- Chemical Reaction Scrollable Display -->
                    <div class="w-full py-2 px-1 text-center">
                        <div id="formula-display" class="formula-text font-black text-white leading-snug tracking-wide w-full flex flex-col justify-center items-center min-h-[72px]">
                            <!-- Dynamic equation content injected here -->
                        </div>
                    </div>
                    
                    <p class="text-[10px] text-slate-500 mt-2 flex items-center gap-1">
                        <i class="fa-solid fa-hand-pointer text-slate-600"></i> タップで次のステップへ
                    </p>
                </div>

                <!-- Card Footer: Progress Bar Dots -->
                <div class="w-full space-y-1.5 z-10">
                    <div class="flex justify-between items-center text-[11px] font-bold text-slate-400 px-0.5">
                        <span class="text-slate-500 text-[10px]">ステップ完了度</span>
                        <span id="step-number-text" class="text-cyan-400 font-mono">1 / 5</span>
                    </div>
                    <!-- Step Progress Indicator Bars -->
                    <div id="step-dots" class="grid grid-cols-5 gap-1.5 h-1.5">
                        <!-- Filled dynamically by JS -->
                    </div>
                </div>

                <!-- Background Watermark Glow -->
                <div id="bg-glow" class="absolute -right-10 -bottom-10 w-40 h-40 bg-blue-600/10 rounded-full blur-2xl pointer-events-none"></div>
            </div>

            <!-- Navigation Control Panel (Thumb-friendly bottom controls) -->
            <div class="grid grid-cols-12 gap-2 shrink-0">
                <!-- Prev Button -->
                <button onclick="prevCard()" class="col-span-3 bg-slate-800 active:bg-slate-700 text-slate-200 border border-slate-700 font-bold py-3 px-2 rounded-xl shadow-md text-xs transition flex flex-col items-center justify-center gap-0.5 active:scale-95">
                    <i class="fa-solid fa-chevron-left text-sm text-slate-400"></i>
                    <span>前へ</span>
                </button>
                
                <!-- Main Action Button (Next Step) -->
                <button onclick="nextStep()" class="col-span-6 bg-gradient-to-r from-emerald-600 to-teal-600 active:from-emerald-500 active:to-teal-500 text-white font-extrabold py-3 px-3 rounded-xl shadow-lg shadow-emerald-950/40 text-sm transition flex items-center justify-center gap-2 active:scale-95 border border-emerald-500/30">
                    <span id="btn-next-step-label">次へ進む</span>
                    <i class="fa-solid fa-circle-chevron-right text-base"></i>
                </button>

                <!-- Next Button -->
                <button onclick="nextCard()" class="col-span-3 bg-slate-800 active:bg-slate-700 text-slate-200 border border-slate-700 font-bold py-3 px-2 rounded-xl shadow-md text-xs transition flex flex-col items-center justify-center gap-0.5 active:scale-95">
                    <i class="fa-solid fa-chevron-right text-sm text-slate-400"></i>
                    <span>次へ</span>
                </button>
            </div>

            <!-- Gesture Hint Footer -->
            <div class="text-center text-[10px] text-slate-500 pt-0.5 shrink-0 flex items-center justify-center gap-3">
                <span>👈 スワイプで切り替え 👉</span>
            </div>

        </div>

        <!-- ================= LIST VIEW (HIDDEN BY DEFAULT) ================= -->
        <div id="view-list" class="hidden absolute inset-0 flex flex-col p-3 max-w-md mx-auto w-full h-full overflow-hidden">
            
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex justify-between items-center shrink-0 mb-3 shadow-md">
                <h2 class="font-extrabold text-sm text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-book-open text-cyan-400"></i> 半反応式 一覧リスト
                </h2>
                <span class="text-xs bg-slate-900 text-cyan-400 font-mono font-bold px-2 py-0.5 rounded-full border border-slate-700">全18種</span>
            </div>

            <!-- Scrollable List Container -->
            <div class="flex-1 overflow-y-auto no-scrollbar space-y-4 pb-12">
                
                <!-- Oxidizing Agents Section -->
                <div class="bg-slate-900 rounded-xl border border-blue-900/60 overflow-hidden shadow-md">
                    <div class="bg-blue-950 px-3.5 py-2 text-blue-300 font-extrabold text-xs flex justify-between items-center border-b border-blue-900/50">
                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-bolt text-blue-400"></i> 主な酸化剤</span>
                        <span class="text-[10px] bg-blue-900/80 text-blue-200 px-2 py-0.5 rounded-md">e⁻を受ける</span>
                    </div>
                    <div class="divide-y divide-slate-800/80" id="list-ox-items">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Reducing Agents Section -->
                <div class="bg-slate-900 rounded-xl border border-rose-900/60 overflow-hidden shadow-md">
                    <div class="bg-rose-950 px-3.5 py-2 text-rose-300 font-extrabold text-xs flex justify-between items-center border-b border-rose-900/50">
                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-fire text-rose-400"></i> 主な還元剤</span>
                        <span class="text-[10px] bg-rose-900/80 text-rose-200 px-2 py-0.5 rounded-md">e⁻を与える</span>
                    </div>
                    <div class="divide-y divide-slate-800/80" id="list-red-items">
                        <!-- Populated by JS -->
                    </div>
                </div>

            </div>
        </div>

    </main>

    <script>
        // High School Chemistry Half-Reaction Dataset
        const REACTION_DATA = [

                    { desc: "Step 4: 水素イオン(H⁺)の放出", html: "H<sub>2</sub>S &rarr; S + 2 e<sup>-</sup> + <span class='text-cyan-400 font-bold highlight-part'>2 H<sup>+</sup></span>" },
                    { desc: "Step 5: 半反応式の完成", html: "H<sub>2</sub>S &rarr; S + 2 e<sup>-</sup> + 2 H<sup>+</sup>" }
                ]
            },
            {

                category: "red",
                name: "過酸化水素 (還元剤として)",

                steps: [

                    { desc: "Step 5: 半反応式の完成", html: "H<sub>2</sub>O<sub>2</sub> &rarr; O<sub>2</sub> + 2 e<sup>-</sup> + 2 H<sup>+</sup>" }

                    { desc: "Step 3: 左辺にH₂Oを補填", html: "SO<sub>2</sub> + <span class='text-emerald-400 font-bold highlight-part'>2 H<sub>2</sub>O</span> &rarr; SO<sub>4</sub><sup>2-</sup>" },
                    { desc: "Step 4: 右辺にe⁻とH⁺を展開", html: "SO<sub>2</sub> + 2 H<sub>2</sub>O &rarr; SO<sub>4</sub><sup>2-</sup> + <span class='text-rose-400 font-bold highlight-part'>2 e<sup>-</sup></span> + <span class='text-cyan-400 font-bold highlight-part'>4 H<sup>+</sup></span>" },
                    { desc: "Step 5: 半反応式の完成", html: "SO<sub>2</sub> + 2 H<sub>2</sub>O &rarr; SO<sub>4</sub><sup>2-</sup> + 2 e<sup>-</sup> + 4 H<sup>+</sup>" }
                ]
            },
            {

                category: "red",
                name: "シュウ酸",
                condition: "H₂C₂O₄",
                hint: "C の酸化数: +3 → +4",
                steps: [
                    { desc: "Step 1: 反応前の物質", html: "H<sub>2</sub>C<sub>2</sub>O<sub>4</sub>" },
                    { desc: "Step 2: 反応後の生成物", html: "H<sub>2</sub>C<sub>2</sub>O<sub>4</sub> &rarr; 2 CO<sub>2</sub>" },
                    { desc: "Step 3: 電子(e⁻)の放出", html: "H<sub>2</sub>C<sub>2</sub>O<sub>4</sub> &rarr; 2 CO<sub>2</sub> + <span class='text-rose-400 font-bold highlight-part'>2 e<sup>-</sup></span>" },
                    { desc: "Step 4: 水素イオン(H⁺)の放出", html: "H<sub>2</sub>C<sub>2</sub>O<sub>4</sub> &rarr; 2 CO<sub>2</sub> + 2 e<sup>-</sup> + <span class='text-cyan-400 font-bold highlight-part'>2 H<sup>+</sup></span>" },
                    { desc: "Step 5: 半反応式の完成", html: "H<sub>2</sub>C<sub>2</sub>O<sub>4</sub> &rarr; 2 CO<sub>2</sub> + 2 e<sup>-</sup> + 2 H<sup>+</sup>" }
                ]
            },
            {
                id: "red-9",
                category: "red",
                name: "チオ硫酸ナトリウム",
                condition: "S₂O₃²⁻",
                hint: "S の酸化数: +2 → +2.5",
                steps: [
                    { desc: "Step 1: 反応前の物質", html: "2 S<sub>2</sub>O<sub>3</sub><sup>2-</sup>" },
                    { desc: "Step 2: 反応後の生成物", html: "2 S<sub>2</sub>O<sub>3</sub><sup>2-</sup> &rarr; S<sub>4</sub>O<sub>6</sub><sup>2-</sup>" },
                    { desc: "Step 3: 電子(e⁻)の放出", html: "2 S<sub>2</sub>O<sub>3</sub><sup>2-</sup> &rarr; S<sub>4</sub>O<sub>6</sub><sup>2-</sup> + <span class='text-rose-400 font-bold highlight-part'>2 e<sup>-</sup></span>" },
                    { desc: "Step 4: 電荷調整完了", html: "2 S<sub>2</sub>O<sub>3</sub><sup>2-</sup> &rarr; S<sub>4</sub>O<sub>6</sub><sup>2-</sup> + 2 e<sup>-</sup>" },
                    { desc: "Step 5: 半反応式の完成", html: "2 S<sub>2</sub>O<sub>3</sub><sup>2-</sup> &rarr; S<sub>4</sub>O<sub>6</sub><sup>2-</sup> + 2 e<sup>-</sup>" }
                ]
            }
        ];

        // App State
        let currentCategory = 'all'; // 'all', 'ox', 'red'
        let isRandom = false;
        let activeList = [];
        let currentIndex = 0;
        let currentStep = 0;
        let isHintVisible = false;

        // Touch Swipe Variables
        let touchStartX = 0;
        let touchStartY = 0;

        // Initialize App
        window.onload = function() {
            filterData();
            renderList();
            updateCardDisplay();

            // Setup Touch Gestures for Mobile Swipe
            const flashcardBox = document.getElementById('flashcard-box');
            
            flashcardBox.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: true });

            flashcardBox.addEventListener('touchend', function(e) {
                const touchEndX = e.changedTouches[0].screenX;
                const touchEndY = e.changedTouches[0].screenY;
                handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
            }, { passive: true });

            // Keyboard navigation (Desktop test support)
            document.addEventListener('keydown', function(e) {
                if (document.getElementById('view-flashcard').classList.contains('hidden')) return;
                
                if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'Enter') {
                    e.preventDefault();
                    nextStep();
                } else if (e.code === 'ArrowRight') {
                    e.preventDefault();
                    nextCard();
                } else if (e.code === 'ArrowLeft') {
                    e.preventDefault();
                    prevCard();
                }
            });
        };

        function handleSwipe(startX, startY, endX, endY) {
            const diffX = endX - startX;
            const diffY = endY - startY;

            // Only trigger if horizontal swipe is prominent (prevents conflict with vertical scrolling)
            if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
                if (diffX < 0) {
                    // Swipe Left -> Next Card
                    nextCard();
                } else {
                    // Swipe Right -> Prev Card
                    prevCard();
                }
            }
        }

        // View Switcher (Flashcard vs List)
        function switchView(view) {
            const fcView = document.getElementById('view-flashcard');
            const listView = document.getElementById('view-list');
            const tabFc = document.getElementById('tab-flashcard');
            const tabList = document.getElementById('tab-list');

            if (view === 'flashcard') {
                fcView.classList.remove('hidden');
                listView.classList.add('hidden');
                tabFc.className = "px-2.5 py-1 rounded-md font-bold bg-cyan-600 text-white transition flex items-center gap-1";
                tabList.className = "px-2.5 py-1 rounded-md font-medium text-slate-400 hover:text-white transition flex items-center gap-1";
            } else {
                fcView.classList.add('hidden');
                listView.classList.remove('hidden');
                tabList.className = "px-2.5 py-1 rounded-md font-bold bg-cyan-600 text-white transition flex items-center gap-1";
                tabFc.className = "px-2.5 py-1 rounded-md font-medium text-slate-400 hover:text-white transition flex items-center gap-1";
            }
        }

        // Category Filter Setup
        function setCategory(cat) {
            currentCategory = cat;
            
            ['all', 'ox', 'red'].forEach(c => {
                const btn = document.getElementById(`btn-cat-${c}`);
                if (c === cat) {
                    btn.className = `px-2.5 py-1 rounded-md text-white font-bold transition ${
                        c === 'ox' ? 'bg-blue-600' : 
                        c === 'red' ? 'bg-rose-600' : 'bg-slate-700'
                    }`;
                } else {
                    btn.className = `px-2.5 py-1 rounded-md text-slate-400 hover:text-slate-200 transition`;
                }
            });

            filterData();
            currentIndex = 0;
            currentStep = 0;
            updateCardDisplay();
        }

        function filterData() {
            if (currentCategory === 'all') {
                activeList = [...REACTION_DATA];
            } else {
                activeList = REACTION_DATA.filter(item => item.category === currentCategory);
            }

            if (isRandom) {
                shuffleArray(activeList);
            }
        }

        function toggleRandomMode() {
            isRandom = !isRandom;
            const btn = document.getElementById('btn-random');
            const icon = document.getElementById('icon-random');
            const label = document.getElementById('label-random');

            if (isRandom) {
                btn.classList.add('bg-slate-700', 'text-cyan-400', 'border-cyan-500/50');
                btn.classList.remove('bg-slate-800', 'text-slate-300');
                icon.className = 'fa-solid fa-shuffle text-cyan-400';
                label.textContent = 'ランダム';
            } else {
                btn.classList.remove('bg-slate-700', 'text-cyan-400', 'border-cyan-500/50');
                btn.classList.add('bg-slate-800', 'text-slate-300');
                icon.className = 'fa-solid fa-shuffle text-slate-500';
                label.textContent = '順送り';
            }

            filterData();
            currentIndex = 0;
            currentStep = 0;
            updateCardDisplay();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Toggle Hint Visibility
        function toggleHint() {
            isHintVisible = !isHintVisible;
            const hintBox = document.getElementById('hint-box');
            if (!hintBox) return;
            if (isHintVisible) {
                hintBox.classList.remove('opacity-0', 'invisible');
                hintBox.classList.add('opacity-100', 'visible');
            } else {
                hintBox.classList.add('opacity-0', 'invisible');
                hintBox.classList.remove('opacity-100', 'visible');
            }
        }

        function hideHint() {
            isHintVisible = false;
            const hintBox = document.getElementById('hint-box');
            if (hintBox) {
                hintBox.classList.add('opacity-0', 'invisible');
                hintBox.classList.remove('opacity-100', 'visible');
            }
        }

        // Update Flashcard UI Content
        function updateCardDisplay() {
            if (activeList.length === 0) return;

            // Reset hint display when switching card or step
            hideHint();

            const item = activeList[currentIndex];
            const stepObj = item.steps[currentStep];

            const cardBox = document.getElementById('flashcard-box');
            const typeBadge = document.getElementById('type-badge');
            const bgGlow = document.getElementById('bg-glow');

            // Set Hint Text
            document.getElementById('hint-text').textContent = item.hint || "酸化数の記載なし";

            // Apply Theme Accent Colors
            if (item.category === 'ox') {
                cardBox.style.borderColor = '#1e40af';
                typeBadge.className = "px-2.5 py-0.5 rounded-full text-[11px] font-extrabold tracking-wide uppercase bg-blue-950 text-blue-300 border border-blue-800 flex items-center gap-1";
                typeBadge.innerHTML = "<i class='fa-solid fa-bolt text-[10px] text-blue-400'></i> 酸化剤";
                bgGlow.className = "absolute -right-10 -bottom-10 w-48 h-48 bg-blue-600/10 rounded-full blur-2xl pointer-events-none";
            } else {
                cardBox.style.borderColor = '#9f1239';
                typeBadge.className = "px-2.5 py-0.5 rounded-full text-[11px] font-extrabold tracking-wide uppercase bg-rose-950 text-rose-300 border border-rose-800 flex items-center gap-1";
                typeBadge.innerHTML = "<i class='fa-solid fa-fire text-[10px] text-rose-400'></i> 還元剤";
                bgGlow.className = "absolute -right-10 -bottom-10 w-48 h-48 bg-rose-600/10 rounded-full blur-2xl pointer-events-none";
            }

            // Labels and Counters
            document.getElementById('item-title').textContent = item.name;
            document.getElementById('item-note').textContent = item.condition || "";
            document.getElementById('card-counter').textContent = `${currentIndex + 1}/${activeList.length}`;

            // Step Description
            document.getElementById('step-description').textContent = stepObj.desc;

            // Format Equation (Horizontal natural reaction equation layout)
            const formulaDisplay = document.getElementById('formula-display');
            formulaDisplay.innerHTML = `
                <div class="text-base sm:text-lg md:text-xl font-bold text-slate-100 tracking-wide break-words max-w-full leading-relaxed px-1">
                    ${stepObj.html}
                </div>
            `;

            // Step Indicator Dots
            const totalSteps = item.steps.length;
            document.getElementById('step-number-text').textContent = `${currentStep + 1} / ${totalSteps}`;

            const dotsContainer = document.getElementById('step-dots');
            dotsContainer.innerHTML = '';
            
            for (let i = 0; i < totalSteps; i++) {
                const dot = document.createElement('div');
                dot.className = `h-full rounded-full transition-all duration-300 ${
                    i <= currentStep 
                        ? (item.category === 'ox' ? 'bg-blue-500 shadow-sm shadow-blue-500/50' : 'bg-rose-500 shadow-sm shadow-rose-500/50') 
                        : 'bg-slate-800'
                }`;
                dotsContainer.appendChild(dot);
            }

            // Button Label Update
            const nextBtnLabel = document.getElementById('btn-next-step-label');
            if (currentStep < totalSteps - 1) {
                nextBtnLabel.textContent = "次ステップ";
            } else {
                nextBtnLabel.textContent = "次の物質";
            }
        }

        // Card Tap Logic
        function handleCardClick(e) {
            nextStep();
        }

        function nextStep() {
            if (activeList.length === 0) return;
            const item = activeList[currentIndex];

            if (currentStep < item.steps.length - 1) {
                currentStep++;
            } else {
                currentStep = 0;
                currentIndex = (currentIndex + 1) % activeList.length;
            }
            updateCardDisplay();
        }

        function prevCard() {
            if (activeList.length === 0) return;
            currentStep = 0;
            currentIndex = (currentIndex - 1 + activeList.length) % activeList.length;
            updateCardDisplay();
        }

        function nextCard() {
            if (activeList.length === 0) return;
            currentStep = 0;
            currentIndex = (currentIndex + 1) % activeList.length;
            updateCardDisplay();
        }

        // Render List View Data
        function renderList() {
            const oxContainer = document.getElementById('list-ox-items');
            const redContainer = document.getElementById('list-red-items');

            oxContainer.innerHTML = '';
            redContainer.innerHTML = '';

            REACTION_DATA.forEach(item => {
                const lastStep = item.steps[item.steps.length - 1].html;
                let formattedStep = lastStep;
                if (lastStep.includes(' &rarr; ')) {
                    const parts = lastStep.split(' &rarr; ');
                    formattedStep = `${parts[0]} <span class="text-cyan-400 font-bold px-1">&rarr;</span> ${parts[1]}`;
                }

                const row = document.createElement('div');
                row.className = "p-3 hover:bg-slate-800/50 transition flex flex-col space-y-1";
                row.innerHTML = `
                    <div class="flex justify-between items-center text-xs">
                        <span class="font-extrabold text-slate-200">${item.name}</span>
                        <span class="text-[10px] text-slate-400 font-mono bg-slate-800 px-1.5 py-0.5 rounded border border-slate-700">${item.condition}</span>
                    </div>
                    <div class="formula-text text-xs sm:text-sm font-bold text-slate-100 overflow-x-auto no-scrollbar whitespace-nowrap pt-0.5">
                        ${formattedStep}
                    </div>
                `;

                if (item.category === 'ox') {
                    oxContainer.appendChild(row);
                } else {
                    redContainer.appendChild(row);
                }
            });
        }
    </script>
